<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Torre de Controle — Auditoria Fiscal</title>
<style>
:root{
  --bg:#070b14;--surface:#0d1424;--surface2:#111a2e;--line:#1f2b44;--line2:#2a3a5c;
  --txt:#e6edf7;--muted:#7c8aa5;--faint:#5b6b86;
  --cyan:#2dd4ee;--violet:#a78bfa;--emerald:#34d399;--amber:#fbbf24;--rose:#fb7185;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#0e1730 0%,var(--bg) 55%);
  color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;padding:22px 18px 40px}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#3b82f6);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#04222b;font-size:18px}
h1{font-size:18px;margin:0;font-weight:680;letter-spacing:-.01em}
h1 span{color:var(--cyan)}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.head-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.status{font-size:12px;color:var(--muted)}
.btn{background:var(--cyan);border:0;color:#04222b;font-weight:650;border-radius:9px;padding:9px 17px;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:880px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);
  border-radius:13px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--cyan))}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.kpi .v{font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--faint);margin-top:2px;min-height:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:13px 15px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
select{background:#0a1120;border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:8px 11px;font-size:13px;min-width:165px;outline:none}
select:focus{border-color:var(--cyan)}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:8px 13px;font-size:12px;cursor:pointer}
.seg button.on{background:#1c2840;color:var(--cyan)}
.btn-clear{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:8px 13px;font-size:12px;cursor:pointer;align-self:flex-end}
.btn-clear:hover{color:var(--txt)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.panel-top{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tbl-scroll{overflow:auto;max-height:68vh}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:#0c1322;text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--txt)}
thead th.r{text-align:right}
th .ar{color:var(--cyan);font-size:9px;margin-left:3px}
tbody td{padding:11px 14px;border-bottom:1px solid #131c30;vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:#0f1830}
.b1{font-weight:600;color:#f3f7fd}
.b2{font-size:11px;color:var(--muted);margin-top:2px}
.transp{font-weight:600;color:var(--violet)}
.cli{font-weight:600;color:#eaf2fd}
.fobcif{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:middle}
.f-CIF{background:rgba(45,212,238,.16);color:var(--cyan)}
.f-FOB{background:rgba(251,191,36,.18);color:var(--amber)}
.sit{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.s-ok{background:rgba(52,211,153,.15);color:var(--emerald)}
.s-canc{background:rgba(251,113,133,.18);color:var(--rose)}
.dev{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.d-de{background:rgba(167,139,250,.16);color:var(--violet)}
.d-por{background:rgba(251,191,36,.15);color:var(--amber)}
tr.canc td{opacity:.75}
.chv{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.01em}
.nf{font-family:var(--mono);color:var(--cyan);font-weight:600}
.tag{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
  background:#16213a;border:1px solid var(--line2);color:#c3cee0;border-radius:6px;padding:2px 8px;font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.r{text-align:right}.val{font-weight:700;font-variant-numeric:tabular-nums;color:#eef4fd}
.dash{color:var(--faint)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:14px}
.qhead{background:var(--surface2);padding:13px 17px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.qtitle{font-size:15px;font-weight:680}.qtot{font-size:18px;font-weight:760;color:var(--emerald);font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:var(--faint);text-align:center;margin-top:18px}
</style></head><body><div class="wrap">

<header>
  <div class="logo">F</div>
  <div>
    <h1>Torre de Controle <span>· Auditoria Fiscal</span></h1>
    <div class="sub">NF-e &middot; CT-e &middot; cancelamentos &middot; transporte e faturamento</div>
  </div>
  <div class="head-right">
    <span class="status" id="status"></span>
    <button class="btn" id="btnUpd" onclick="atualizar()">Atualizar</button>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<div class="bar">
  <div class="fg"><label>Situacao</label><select id="fSit">
    <option value="">Todas</option><option value="Autorizada">Autorizada</option><option value="Cancelada">Cancelada</option></select></div>
  <div class="fg"><label>Emissor</label><select id="fEmit"></select></div>
  <div class="fg"><label>Natureza da Operacao</label><select id="fNat"></select></div>
  <div class="fg"><label>Cliente</label><select id="fDest"></select></div>
  <div class="fg"><label>Transportador</label><select id="fTransp"></select></div>
  <div class="fg"><label>FOB / CIF</label><select id="fFob"></select></div>
  <div class="fg"><label>Vinculo CT-e</label><select id="fVinc">
    <option value="">Todos</option><option value="sem">Sem CT-e</option><option value="com">Com CT-e</option><option value="dev">Vinculo por devolucao</option><option value="aberto">Em aberto (sem CT-e e sem devolucao)</option></select></div>
  <div class="fg"><label>Mes (emissao NF)</label><select id="fMes"></select></div>
  <div class="fg"><label>Visao</label><div class="seg" id="segVisao">
    <button data-v="nota" class="on">Notas</button>
    <button data-v="quarter">Acumulado / quarter</button></div></div>
  <button class="btn-clear" onclick="limpar()">Limpar filtros</button>
</div>

<div id="view"><div class="panel"><div class="empty">Carregando dados…</div></div></div>
<div class="foot">Dados do Supabase (dashboards/auditoria/dados.json). Atualizar reprocessa as pastas quando rodado pelo programa local.</div>
</div>

<script>
const SUPA='https://ennsbpibfnuwlvtodukg.supabase.co';
const STORAGE=SUPA+'/storage/v1/object/public/dashboards/auditoria/dados.json';
const LIMITE=800;
let DATA={notas:[],ctes:[],refs:[]};

const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR=s=>{if(!s)return '';const p=(''+s).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s};
const mesDe=s=>(''+s).slice(0,7);
const MES=['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesLabel=ym=>{const[a,m]=ym.split('-');return MES[+m]+'/'+a};
const quarterDe=s=>{const m=+(''+s).slice(5,7),a=(''+s).slice(0,4);return a+'-Q'+(Math.ceil(m/3))};
function st(t){document.getElementById('status').textContent=t||''}

async function carregarDados(){
  for(const u of [STORAGE+'?t='+Date.now(), './dados.json?t='+Date.now()]){
    try{const r=await fetch(u);if(r.ok)return await r.json();}catch(e){}
  }
  return {notas:[],ctes:[],refs:[]};
}
async function atualizar(){
  const b=document.getElementById('btnUpd');b.disabled=true;st('Reprocessando…');
  try{const r=await fetch('/atualizar');if(r.ok){DATA=await carregarDados();montarFiltros();render();st('Atualizado agora.');b.disabled=false;return;}}catch(e){}
  DATA=await carregarDados();montarFiltros();render();
  st('Dados recarregados da nuvem.');b.disabled=false;
}

const transpByNota={};
function indexar(){for(const k in transpByNota)delete transpByNota[k];
  const porChave=new Map(DATA.ctes.map(c=>[c.chave,c]));
  DATA.refs.forEach(r=>{const c=porChave.get(r.chave_cte);
    if(c)transpByNota[r.chave_nfe]={nome:c.nome_emitente||'',num:c.numero,rota:(c.uf_inicio||'')+'→'+(c.uf_fim||''),frete:c.valor_total,data:c.data_emissao};});
}
const T=ch=>transpByNota[ch]||null;

let state={sit:'',emit:'',nat:'',dest:'',transp:'',fob:'',vinc:'',mes:'',visao:'nota'};
let sort={col:'dataNF',dir:-1};

function opts(sel,vals,label){const el=document.getElementById(sel),cur=el.value;
  el.innerHTML='<option value="">Todos</option>'+vals.map(v=>`<option value="${v}">${label?label(v):v}</option>`).join('');el.value=cur}
function montarFiltros(){indexar();
  opts('fEmit',[...new Set(DATA.notas.map(n=>n.nome_emitente))].filter(Boolean).sort());
  opts('fNat',[...new Set(DATA.notas.map(n=>n.natureza_operacao))].filter(Boolean).sort());
  opts('fDest',[...new Set(DATA.notas.map(n=>n.nome_destinatario))].filter(Boolean).sort());
  opts('fTransp',[...new Set(DATA.ctes.map(c=>c.nome_emitente))].filter(Boolean).sort());
  opts('fFob',[...new Set(DATA.notas.map(n=>n.fob_cif))].filter(Boolean).sort());
  opts('fMes',[...new Set(DATA.notas.map(n=>mesDe(n.data_emissao)))].filter(Boolean).sort(),mesLabel)}
['fSit','fEmit','fNat','fDest','fTransp','fFob','fVinc','fMes'].forEach((id,i)=>document.getElementById(id).onchange=e=>{state[['sit','emit','nat','dest','transp','fob','vinc','mes'][i]]=e.target.value;render()});
document.querySelectorAll('#segVisao button').forEach(b=>b.onclick=()=>{state.visao=b.dataset.v;document.querySelectorAll('#segVisao button').forEach(x=>x.classList.toggle('on',x===b));render()});
function limpar(){state.sit=state.emit=state.nat=state.dest=state.transp=state.fob=state.vinc=state.mes='';['fSit','fEmit','fNat','fDest','fTransp','fFob','fVinc','fMes'].forEach(id=>document.getElementById(id).value='');render()}

function filtradas(){return DATA.notas.filter(n=>(!state.sit||n.situacao===state.sit)&&(!state.emit||n.nome_emitente===state.emit)&&(!state.nat||n.natureza_operacao===state.nat)&&(!state.dest||n.nome_destinatario===state.dest)&&(!state.mes||mesDe(n.data_emissao)===state.mes)&&(!state.transp||(T(n.chave)&&T(n.chave).nome===state.transp))&&(!state.fob||n.fob_cif===state.fob)&&(!state.vinc||(state.vinc==='com'?!!T(n.chave):state.vinc==='sem'?!T(n.chave):state.vinc==='dev'?temDev(n):(!T(n.chave)&&!temDev(n)))))}

function valSort(n,col){const t=T(n.chave);switch(col){
  case'chave':return n.chave||'';
  case'sit':return n.situacao||'';
  case'dataCanc':return n.data_cancelamento||'';
  case'dev':return n.dev_de?('a'+n.dev_de.numero):(n.dev_por&&n.dev_por.length?('b'+n.dev_por[0].numero):'z');
  case'serie':return +n.serie||0;
  case'transp':return (transpDe(n)||'').toLowerCase();
  case'emissor':return (n.nome_emitente||'').toLowerCase();
  case'cliente':return (n.nome_destinatario||'').toLowerCase();
  case'mun':return (n.municipio_destinatario||'').toLowerCase();
  case'uf':return n.uf_destinatario||'';
  case'frete':return n.mod_frete||'';
  case'vol':return +n.qtd_volumes||0;
  case'peso':return +n.peso_bruto||0;
  case'nf':return +n.numero||0;
  case'nat':return (n.natureza_operacao||'').toLowerCase();
  case'dataNF':return n.data_emissao||'';
  case'dataCT':return t?(t.data||''):'';
  case'valor':return +n.valor_total||0;default:return ''}}
function transpDe(n){const t=T(n.chave);return (t&&t.nome)||n.nome_transportadora||''}
function temDev(n){return !!(n.dev_de||(n.dev_por&&n.dev_por.length))}
function ordenar(arr){const{col,dir}=sort;return arr.sort((a,b)=>{const x=valSort(a,col),y=valSort(b,col);return x<y?-dir:x>y?dir:0})}
function thSort(col){return sort.col===col?`<span class="ar">${sort.dir>0?'▲':'▼'}</span>`:''}
window.setSort=c=>{if(sort.col===c)sort.dir*=-1;else{sort.col=c;sort.dir=1}render()};

function kpis(fn){const tot=fn.reduce((s,n)=>s+ +n.valor_total,0);
  const comcte=fn.filter(n=>T(n.chave)).length;
  const canc=fn.filter(n=>n.situacao==='Cancelada').length;
  const cli=new Set(fn.map(n=>n.nome_destinatario).filter(Boolean)).size;
  const K=[['Notas',fn.length.toLocaleString('pt-BR'),'','var(--cyan)'],
    ['Valor total NF',brl(tot),'','var(--emerald)'],
    ['Com CT-e',comcte.toLocaleString('pt-BR'),fn.length?Math.round(comcte/fn.length*100)+'% das notas':'','var(--violet)'],
    ['Canceladas',canc.toLocaleString('pt-BR'),fn.length?Math.round(canc/fn.length*100)+'% das notas':'','var(--rose)'],
    ['Clientes',cli,'','#60a5fa']];
  document.getElementById('kpis').innerHTML=K.map(k=>`<div class="kpi" style="--accent:${k[3]}"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]||''}</div></div>`).join('')}

function render(){const fnAll=filtradas();kpis(fnAll);const v=document.getElementById('view');
 if(!fnAll.length){v.innerHTML='<div class="panel"><div class="empty">Nenhuma nota para os filtros selecionados.</div></div>';return}

 if(state.visao==='nota'){
   const fn=ordenar(fnAll.slice());const vis=fn.slice(0,LIMITE);
   const H=(c,t,cls)=>`<th class="${cls||''}" onclick="setSort('${c}')">${t}${thSort(c)}</th>`;
   v.innerHTML=`<div class="panel">
     <div class="panel-top"><span>${fnAll.length.toLocaleString('pt-BR')} nota(s)${fn.length>LIMITE?` — mostrando ${LIMITE} (refine os filtros)`:''}</span>
       <span>clique no titulo para ordenar</span></div>
     <div class="tbl-scroll"><table><thead><tr>
       ${H('chave','Chave de Acesso')}${H('sit','Situacao')}${H('dataCanc','Data Cancelamento')}${H('dev','Devolucao')}
       ${H('serie','Serie')}${H('nat','Natureza da Operacao')}${H('emissor','Emitente')}
       ${H('cliente','Destinatario')}${H('mun','Municipio Dest.')}${H('uf','UF Dest.')}
       ${H('frete','Modalidade Frete')}${H('transp','Transportadora')}
       ${H('vol','Qtd Volumes','r')}${H('peso','Peso Bruto','r')}${H('valor','Valor Total NF','r')}
     </tr></thead><tbody>`+
     vis.map(n=>{const t=T(n.chave);const canc=n.situacao==='Cancelada';const tn=transpDe(n);return `<tr class="${canc?'canc':''}">
       <td><span class="chv" title="${n.chave}">${n.chave}</span><div class="b2">NF <span class="nf">${n.numero}</span> · ${dBR(n.data_emissao)}</div></td>
       <td><span class="sit ${canc?'s-canc':'s-ok'}">${n.situacao||'Autorizada'}</span></td>
       <td class="mono">${n.data_cancelamento?dBR(n.data_cancelamento):'<span class="dash">—</span>'}</td>
       <td>${n.dev_de?`<span class="dev d-de" title="Esta nota e devolucao da NF ${n.dev_de.numero}">↩ devolve NF ${n.dev_de.numero}</span>`:(n.dev_por&&n.dev_por.length?n.dev_por.map(d=>`<span class="dev d-por" title="Coberta pela devolucao NF ${d.numero}">✔ coberta por NF ${d.numero}</span>`).join('<br>'):'<span class="dash">—</span>')}</td>
       <td class="mono">${n.serie||''}</td>
       <td><span class="tag" title="${n.natureza_operacao||''}">${n.natureza_operacao||''}</span></td>
       <td><div class="b1">${n.nome_emitente||''}</div><div class="b2">${n.uf_emitente||''}</div></td>
       <td><div class="cli">${n.nome_destinatario||''}${n.fob_cif?` <span class="fobcif f-${n.fob_cif}">${n.fob_cif}</span>`:''}</div></td>
       <td>${n.municipio_destinatario||'<span class="dash">—</span>'}</td>
       <td class="mono">${n.uf_destinatario||''}</td>
       <td>${n.mod_frete||'<span class="dash">—</span>'}</td>
       <td>${tn?`<div class="transp">${tn}</div>${t?`<div class="b2">CT-e ${t.num} · ${t.rota}</div>`:''}`:'<span class="dash">— sem CT-e</span>'}</td>
       <td class="r mono">${n.qtd_volumes!=null?Number(n.qtd_volumes).toLocaleString('pt-BR'):'<span class="dash">—</span>'}</td>
       <td class="r mono">${n.peso_bruto!=null?Number(n.peso_bruto).toLocaleString('pt-BR',{maximumFractionDigits:1}):'<span class="dash">—</span>'}</td>
       <td class="r val">${brl(n.valor_total)}</td></tr>`}).join('')+
     `</tbody></table></div></div>`}
 else{
   const qs={};fnAll.forEach(n=>{const q=quarterDe(n.data_emissao);qs[q]=qs[q]||{nat:{},count:0,total:0};
     qs[q].count++;qs[q].total+= +n.valor_total;
     const k=n.natureza_operacao||'(sem natureza)';qs[q].nat[k]=qs[q].nat[k]||{count:0,total:0};
     qs[q].nat[k].count++;qs[q].nat[k].total+= +n.valor_total});
   v.innerHTML=Object.keys(qs).sort().map(q=>{const d=qs[q];
     return `<div class="qcard"><div class="qhead"><span class="qtitle">${q} <span class="b2">· ${d.count} notas</span></span><span class="qtot">${brl(d.total)}</span></div>
       <div class="tbl-scroll"><table><thead><tr><th>Natureza de operacao</th><th class="r">Notas</th><th class="r">Valor acumulado</th></tr></thead><tbody>`+
       Object.keys(d.nat).sort((a,b)=>d.nat[b].total-d.nat[a].total).map(nat=>`<tr><td>${nat}</td><td class="r mono">${d.nat[nat].count}</td><td class="r val">${brl(d.nat[nat].total)}</td></tr>`).join('')+
       '</tbody></table></div></div>'}).join('')}
}

(async()=>{st('Carregando…');DATA=await carregarDados();montarFiltros();render();st(DATA.notas.length.toLocaleString('pt-BR')+' notas.')})();
</script></body></html>
