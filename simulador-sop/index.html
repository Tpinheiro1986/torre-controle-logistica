:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede8;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9b9b97;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --radius:8px;--radius-lg:14px;
  --primary:#7030A0; --primary-d:#552477;
  --green:#1D9E75; --green-d:#0F6E56; --green-bg:#E1F5EE;
  --blue:#378ADD; --blue-d:#185FA5; --blue-bg:#E6F1FB;
  --red:#A32D2D; --red-d:#791F1F; --red-bg:#FCEBEB;
  --orange:#BA7517; --orange-d:#633806; --orange-bg:#FAEEDA;
  --gray-bg:#E8E8E8; --gray-text:#595959;
  --q1:#F4CCCC; --q2:#FCE5CD; --q3:#D9EAD3; --q4:#CFE2F3;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0ede6;--text2:#a0a09a;--text3:#6b6b67;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);--gray-bg:#3a3a37;--gray-text:#a0a09a;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;font-size:13px}

/* LOGIN */
#screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{background:var(--bg);border:0.5px solid var(--border);border-radius:18px;padding:44px 48px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.brand-icon{width:38px;height:38px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
.brand-name{font-size:14px;font-weight:700}
.brand-sub{font-size:11px;color:var(--text2);margin-top:1px}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.form-input{width:100%;padding:10px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-size:13px;outline:none}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(112,48,160,.10)}
.btn-primary{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
.btn-primary:hover{background:var(--primary-d)}
.login-err{background:var(--red-bg);color:var(--red);border:0.5px solid #F7C1C1;border-radius:var(--radius);padding:10px 14px;font-size:12px;margin-top:10px;display:none}

/* APP */
#screen-app{display:none;min-height:100vh}
.topnav{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-back{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);text-decoration:none;padding:5px 10px;border:0.5px solid var(--border2);border-radius:14px;background:var(--bg2)}
.nav-back:hover{background:var(--bg3)}
.nav-icon{width:30px;height:30px;background:var(--primary);border-radius:7px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.nav-title{font-size:14px;font-weight:700}
.nav-sub{font-size:10px;color:var(--text2);margin-top:1px}
.nav-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--bg2);border:0.5px solid var(--border);border-radius:20px;padding:4px 12px 4px 4px}
.user-av{width:24px;height:24px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.user-em{font-size:11px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:14px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}

/* TABS */
.tabs{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 28px;display:flex;gap:0;overflow-x:auto;position:sticky;top:54px;z-index:99}
.tab{padding:12px 18px;font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-edit::after{content:'✎';margin-left:6px;color:#FFB400;font-size:11px}

/* CONTENT */
.container{max-width:100%;padding:24px 28px}
.panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-sub{font-size:11px;color:var(--text2);margin-bottom:14px}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:600}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:2px}
.kpi.warn{background:var(--orange-bg)}
.kpi.warn .kpi-label,.kpi.warn .kpi-sub{color:var(--orange-d)}
.kpi.warn .kpi-value{color:var(--orange-d)}
.kpi.danger{background:var(--red-bg)}
.kpi.danger .kpi-label,.kpi.danger .kpi-sub{color:var(--red-d)}
.kpi.danger .kpi-value{color:var(--red-d)}

/* CAPACITY BOX */
.cap-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);margin-bottom:14px;font-size:12px}
.cap-item{display:flex;align-items:center;gap:6px}
.cap-input{width:80px;padding:4px 8px;background:#FFF2CC;border:0.5px solid #DEC270;border-radius:4px;font-size:12px;color:#0000FF;font-weight:600}

/* TABLES */
.tbl-wrap{overflow-x:auto;border:0.5px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 9px;text-align:left;border-bottom:0.5px solid var(--border);white-space:nowrap}
th{background:#1F3864;color:#fff;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:2}
th.q1{background:#A03030;color:#fff}
th.q2{background:#B25E10;color:#fff}
th.q3{background:#0F6E56;color:#fff}
th.q4{background:#185FA5;color:#fff}
tr:hover td{background:var(--bg2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.center{text-align:center}
.editable{background:#FFF2CC;color:#0000FF;font-weight:600}
.editable input,.editable select{background:transparent;border:none;outline:none;font-weight:600;color:#0000FF;font-size:12px;width:100%;font-family:inherit}
.editable input:focus{background:#fff;border:1px solid var(--primary)}
.hist{background:var(--gray-bg);color:var(--gray-text)}
.badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:500;display:inline-block}
.badge-ok{background:var(--green-bg);color:var(--green-d)}
.badge-warn{background:var(--orange-bg);color:var(--orange-d)}
.badge-danger{background:var(--red-bg);color:var(--red-d)}
.badge-genomma{background:var(--blue-bg);color:var(--blue-d)}
.badge-inovalab{background:var(--green-bg);color:var(--green-d)}
.badge-desativado{background:var(--red-bg);color:var(--red-d);font-weight:600}
.row-overflow td{background:#FCEBEB !important}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:7px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-d)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{background:var(--green-d)}

/* CELL COLORS */
.cell-green{background:#C6EFCE;color:#0F6E56;font-weight:600}
.cell-yellow{background:#FCE5A0;color:#633806;font-weight:600}
.cell-red{background:#F4C7C3;color:#791F1F;font-weight:600}
.cell-gray{background:#E8E8E8;color:#595959;font-weight:600}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);font-size:13px}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

.tab-content{display:none}
.tab-content.active{display:block}

.alert{padding:12px 16px;border-radius:var(--radius);font-size:12px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.alert-warn{background:var(--orange-bg);color:var(--orange-d);border-left:3px solid var(--orange)}
.alert-danger{background:var(--red-bg);color:var(--red-d);border-left:3px solid var(--red)}

.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state svg{width:48px;height:48px;stroke:var(--text3);fill:none;stroke-width:1.5;margin-bottom:14px}
</style>
</head>

const MESES_ABR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const QUARTER_OF_MES = [1,1,1,2,2,2,3,3,3,4,4,4];
const QCOLOR = ['','#A03030','#B25E10','#0F6E56','#185FA5'];

// Calendário 4-4-5 por quarter (totaliza 52 semanas)
const CALENDARIO = [
  {mes:'Janeiro',  nsem:4, idx:1, q:1},
  {mes:'Fevereiro',nsem:4, idx:2, q:1},
  {mes:'Março',    nsem:5, idx:3, q:1},
  {mes:'Abril',    nsem:4, idx:4, q:2},
  {mes:'Maio',     nsem:4, idx:5, q:2},
  {mes:'Junho',    nsem:5, idx:6, q:2},
  {mes:'Julho',    nsem:4, idx:7, q:3},
  {mes:'Agosto',   nsem:4, idx:8, q:3},
  {mes:'Setembro', nsem:5, idx:9, q:3},
  {mes:'Outubro',  nsem:4, idx:10,q:4},
  {mes:'Novembro', nsem:4, idx:11,q:4},
  {mes:'Dezembro', nsem:5, idx:12,q:4},
];
const MAPA_SEMANAS = (function(){
  const arr = [];
  let posQ = 0, qPrev = 0;
  CALENDARIO.forEach(({mes, nsem, idx, q}) => {
    if(q !== qPrev){ posQ = 0; qPrev = q; }
    for(let s = 1; s <= nsem; s++){
      posQ++;
      arr.push({mesIdx:idx, mesAbr:MESES_ABR[idx-1], semNoMes:s, q, posNoQ:posQ,
                label:`${MESES_ABR[idx-1]}-S${s}`});
    }
  });
  return arr;
})();
// MAPA_SEMANAS tem 52 entradas: índice 0..21 = histórico (Jan-Mai), 21..51 = simulação (Jun-Dez)
const PRIMEIRA_SIM = MAPA_SEMANAS.findIndex(s => s.mesIdx === 6);

async function checkSession(){
  try{
    if(window.location.hash && window.location.hash.includes('access_token')){
      await new Promise(r=>setTimeout(r,800));
      window.history.replaceState(null,'',window.location.pathname);
    }
    const {data:{session}} = await sb.auth.getSession();
    if(!session){ showLogin(); return; }
    showApp(session.user);
  }catch(e){ showLogin(); }
}

async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const btn   = document.getElementById('btn-login');
  const err   = document.getElementById('login-err');
  err.style.display = 'none';
  if(!email || !pass){ showErr(err,'Preencha e-mail e senha.'); return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  try{
    const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
    if(error){
      let msg = error.message;
      if(msg.includes('Invalid login')) msg = 'E-mail ou senha incorretos.';
      showErr(err, msg); btn.disabled=false; btn.textContent='Entrar';
    } else { showApp(data.user); }
  }catch(e){
    showErr(err,'Erro: '+e.message); btn.disabled=false; btn.textContent='Entrar';
  }
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('screen-app').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
}

function showLogin(){
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('screen-app').style.display = 'none';
}

async function showApp(user){
  currentUser = user;

sb.auth.onAuthStateChange((event,session)=>{

function lerSeed(){
  try{
    const tag = document.getElementById('SEED_DATA');
    if(!tag) return null;
    return JSON.parse(tag.textContent);
  }catch(e){ console.warn('Seed inválido:', e); return null; }
}

function aplicarSeed(seed){
  // Parametros
  Object.assign(state.parametros, seed.parametros || {});
  // SKUs (mantém formato da tabela)
  state.skus = (seed.skus || []).map(s => ({
    ...s,
    upp_efetiva: s.upp_override || s.upp_cadastro || 2000
  }));
  // Saidas/entradas
  state.saidas = {};
  Object.entries(seed.saidas || {}).forEach(([cod, meses]) => {
    state.saidas[cod] = {};
    Object.entries(meses).forEach(([m, v]) => state.saidas[cod][parseInt(m)] = parseFloat(v) || 0);
  });
  state.entradas = {};
  Object.entries(seed.entradas || {}).forEach(([cod, meses]) => {
    state.entradas[cod] = {};
    Object.entries(meses).forEach(([m, v]) => state.entradas[cod][parseInt(m)] = parseFloat(v) || 0);
  });
  // Estoque
  state.estoque = {};
  Object.entries(seed.estoque || {}).forEach(([cod, v]) => state.estoque[cod] = parseFloat(v) || 0);
  // Curva
  state.curva = {GENOMMA:{1:[],2:[],3:[],4:[]}, INOVALAB:{1:[],2:[],3:[],4:[]}};
  Object.entries(seed.curva || {}).forEach(([emp, qmap]) => {
    if(!state.curva[emp]) state.curva[emp] = {1:[],2:[],3:[],4:[]};
    Object.entries(qmap).forEach(([q, arr]) => {
      const a = (arr || []).map(v => parseFloat(v) || 0);
      while(a.length < 13) a.push(0);
      state.curva[emp][parseInt(q)] = a;
    });
  });
}

async function gravarSeedNoSupabase(seed){
  if(!isAdmin){ console.warn('[seed] não é admin, abortando'); return false; }

  const check = (label, result) => {
    if(result?.error){
      console.error(`[seed] ✗ ${label}:`, result.error.message, result.error);
      throw new Error(`${label}: ${result.error.message}`);
    }
    console.log(`[seed] ✓ ${label}`);
    return result;
  };

  try{
    // 1. Parametros (sop_meta)
    const metaPayload = Object.entries(seed.parametros).map(([chave, valor]) => ({
      chave, valor: String(valor), user_email: currentUser.email
    }));
    check('parametros (sop_meta)',
      await sb.from('sop_meta').upsert(metaPayload, {onConflict:'chave'}));

    // 2. SKUs
    const skuPayload = seed.skus.map(s => ({
      cod_item: s.cod_item,
      descricao: s.descricao || '',
      marca: s.marca || '',
      empresa: s.empresa || 'GENOMMA',
      upp_cadastro: s.upp_cadastro || null,
      upp_override: s.upp_override || null,
      upp_efetiva: s.upp_override || s.upp_cadastro || 2000,
      gtin14: s.gtin14 || null,
      status_supply: s.status_supply || null
    }));
    check(`SKUs (${skuPayload.length} linhas)`,
      await sb.from('sop_sku').upsert(skuPayload, {onConflict:'cod_item'}));

    // 3. Plano de saídas
    const saidaPayload = [];
    Object.entries(seed.saidas).forEach(([cod, meses]) => {
      Object.entries(meses).forEach(([m, v]) => {
        const ym = `2026-${String(m).padStart(2,'0')}-01`;
        if(v > 0) saidaPayload.push({cod_item: cod, year_month: ym, qty_un: v, horizonte: '2026'});
      });
    });
    check('limpar sop_plano_saida',
      await sb.from('sop_plano_saida').delete().eq('horizonte','2026'));
    if(saidaPayload.length){
      // Inserir em lotes de 500 para evitar payload muito grande
      for(let i = 0; i < saidaPayload.length; i += 500){
        const lote = saidaPayload.slice(i, i+500);
        check(`saídas lote ${i/500+1}/${Math.ceil(saidaPayload.length/500)}`,
          await sb.from('sop_plano_saida').insert(lote));
      }
    }

    // 4. Plano de entradas
    const entPayload = [];
    Object.entries(seed.entradas).forEach(([cod, meses]) => {
      Object.entries(meses).forEach(([m, v]) => {
        const ym = `2026-${String(m).padStart(2,'0')}-01`;
        if(v > 0) entPayload.push({cod_item: cod, year_month: ym, qty_un: v, horizonte: '2026'});
      });
    });
    check('limpar sop_plano_entrada',
      await sb.from('sop_plano_entrada').delete().eq('horizonte','2026'));
    if(entPayload.length){
      for(let i = 0; i < entPayload.length; i += 500){
        const lote = entPayload.slice(i, i+500);
        check(`entradas lote ${i/500+1}/${Math.ceil(entPayload.length/500)}`,
          await sb.from('sop_plano_entrada').insert(lote));
      }
    }

    // 5. Estoque (foto de hoje)
    const today = new Date().toISOString().slice(0,10);
    const estPayload = Object.entries(seed.estoque).map(([cod, v]) => ({
      cod_item: cod, snapshot_date: today, qty_un: v
    }));
    if(estPayload.length){
      check(`estoque (${estPayload.length} linhas)`,
        await sb.from('sop_estoque').upsert(estPayload, {onConflict:'cod_item,snapshot_date'}));
    }

    // 6. Curva
    const curvaPayload = [];
    Object.entries(seed.curva).forEach(([emp, qmap]) => {
      Object.entries(qmap).forEach(([q, arr]) => {
        arr.forEach((pct, i) => {
          if(pct > 0) curvaPayload.push({
            empresa: emp, quarter: parseInt(q),
            semana_no_quarter: i + 1, pct
          });
        });
      });
    });
    check('limpar sop_curva_quarter',
      await sb.from('sop_curva_quarter').delete().gte('quarter', 1));
    if(curvaPayload.length){
      check(`curva (${curvaPayload.length} linhas)`,
        await sb.from('sop_curva_quarter').insert(curvaPayload));
    }

    // 7. Marca seed como carregado
    check('marcar seed_loaded_at',
      await sb.from('sop_meta').upsert({
        chave: 'seed_loaded_at',
        valor: new Date().toISOString(),
        user_email: currentUser.email
      }, {onConflict:'chave'}));

    console.log('[seed] ✅ TUDO GRAVADO COM SUCESSO');
    return true;
  }catch(e){
    console.error('[seed] ❌ Falha:', e.message);
    return false;
  }
}

async function loadAll(){
  state.loading = true;
  renderActiveTab();
  try{
    const [meta, skus, saidas, entradas, estoque, curva] = await Promise.all([
      sb.from('sop_meta').select('*'),
      sb.from('sop_sku').select('*').order('empresa').order('marca').order('descricao'),
      sb.from('sop_plano_saida').select('*').eq('horizonte','2026'),
      sb.from('sop_plano_entrada').select('*').eq('horizonte','2026'),
      sb.from('sop_estoque').select('*').order('snapshot_date',{ascending:false}).limit(2000),
      sb.from('sop_curva_quarter').select('*')
    ]);

    // Detectar Supabase vazio (qualquer das 3 tabelas centrais)
    const skusVazio    = !skus.data    || skus.data.length    === 0;
    const saidasVazio  = !saidas.data  || saidas.data.length  === 0;
    const estoqueVazio = !estoque.data || estoque.data.length === 0;
    const bancoVazio = skusVazio || saidasVazio || estoqueVazio;

    console.log('[loadAll] SKUs no banco:', skus.data?.length || 0,
                '| Saídas:', saidas.data?.length || 0,
                '| Entradas:', entradas.data?.length || 0,
                '| Estoque:', estoque.data?.length || 0,
                '| Curva:', curva.data?.length || 0,
                '| Banco vazio?', bancoVazio);

    if(bancoVazio){
      // Banco vazio (total ou parcial) → aplicar seed embutido
      const seed = lerSeed();
      if(seed){
        console.log('[loadAll] ▶ Aplicando seed embutido (banco vazio/incompleto)');
        aplicarSeed(seed);
        state._usandoSeed = true;
        // Se admin: tentar gravar no Supabase para virar fonte de verdade
        if(isAdmin){
          console.log('[loadAll] ▶ Admin detectado, gravando seed no Supabase...');
          const gravou = await gravarSeedNoSupabase(seed);
          if(gravou){
            console.log('[loadAll] ✓ Seed gravado no Supabase com sucesso');
            state._usandoSeed = false;
          } else {
            console.warn('[loadAll] ⚠ Falha ao gravar seed (RLS? policies?)');
          }
        } else {
          console.log('[loadAll] ℹ Não-admin, seed apenas em memória');
        }
        state.loading = false;
        renderActiveTab();
        return;
      } else {
        console.warn('[loadAll] ⚠ Banco vazio mas seed não encontrado!');
      }
    }

    // Parametros
    if(meta.data){
      meta.data.forEach(m => {
        if(m.chave === 'cap_genomma')  state.parametros.cap_genomma  = parseFloat(m.valor);
        if(m.chave === 'cap_inovalab') state.parametros.cap_inovalab = parseFloat(m.valor);
        if(m.chave === 'safety_pct')   state.parametros.safety_pct   = parseFloat(m.valor);
        for(let i = 1; i <= 5; i++){
          if(m.chave === `entrada_s${i}`) state.parametros[`entrada_s${i}`] = parseFloat(m.valor);
        }
      });
    }

    // SKUs
    state.skus = (skus.data || []).map(s => ({
      ...s,
      upp_efetiva: s.upp_override || s.upp_cadastro || 2000
    }));

    // Saidas e entradas: indexar por SKU e mês
    state.saidas = {};
    (saidas.data || []).forEach(s => {
      const mes = parseInt(s.year_month.slice(5,7));
      if(!state.saidas[s.cod_item]) state.saidas[s.cod_item] = {};
      state.saidas[s.cod_item][mes] = parseFloat(s.qty_un) || 0;
    });
    state.entradas = {};
    (entradas.data || []).forEach(s => {
      const mes = parseInt(s.year_month.slice(5,7));
      if(!state.entradas[s.cod_item]) state.entradas[s.cod_item] = {};
      state.entradas[s.cod_item][mes] = parseFloat(s.qty_un) || 0;
    });

    // Estoque: pegar a foto mais recente de cada SKU
    state.estoque = {};
    (estoque.data || []).forEach(s => {
      if(state.estoque[s.cod_item] === undefined){
        state.estoque[s.cod_item] = parseFloat(s.qty_un) || 0;
      }
    });

    // Curva
    state.curva = {GENOMMA:{1:[],2:[],3:[],4:[]}, INOVALAB:{1:[],2:[],3:[],4:[]}};
    (curva.data || []).forEach(c => {
      if(!state.curva[c.empresa]) state.curva[c.empresa] = {1:[],2:[],3:[],4:[]};
      if(!state.curva[c.empresa][c.quarter]) state.curva[c.empresa][c.quarter] = [];
      state.curva[c.empresa][c.quarter][c.semana_no_quarter - 1] = parseFloat(c.pct);
    });
    // Garantir 13 posições por curva
    ['GENOMMA','INOVALAB'].forEach(e => {
      [1,2,3,4].forEach(q => {
        const arr = state.curva[e][q] || [];
        while(arr.length < 13) arr.push(0);
        state.curva[e][q] = arr;
      });
    });

    state.loading = false;
    renderActiveTab();
  }catch(e){
    console.error(e);
    // Em caso de erro grave no Supabase, tentar usar seed como fallback final
    const seed = lerSeed();
    if(seed){
      console.warn('Supabase indisponível, usando seed embutido');
      aplicarSeed(seed);
      state.loading = false;
      renderActiveTab();
      return;
    }
    state.loading = false;
    document.getElementById('content').innerHTML =
      `<div class="alert alert-danger">Erro ao carregar dados: ${e.message}</div>`;
  }
}

// MOTOR DE SIMULAÇÃO
// ============================================================
function calcularPP(estoqueUN, upp){
  if(estoqueUN <= 0) return 0;
  return Math.ceil(estoqueUN / upp);
}

function simulacaoMensal(){
  // Retorna {cod_item: [eop_jan, eop_fev, ..., eop_dez]}
  // Janeiro a Maio: estoque atual constante (foto)
  // Junho em diante: simulação real
  const out = {};
  state.skus.forEach(sku => {
    const cod = sku.cod_item;
    const upp = sku.upp_efetiva;
    const estIni = state.estoque[cod] || 0;
    const eop = new Array(12).fill(0);
    // Jan-Mai = estoque atual
    for(let m = 0; m < 5; m++) eop[m] = estIni;
    // Junho em diante
    let prev = estIni;
    for(let m = 5; m < 12; m++){  // m=5 (Junho) ... 11 (Dezembro)
      const ent = (state.entradas[cod] && state.entradas[cod][m+1]) || 0;
      const sai = (state.saidas[cod]  && state.saidas[cod][m+1])  || 0;
      const novo = Math.max(prev + ent - sai, 0);
      eop[m] = novo;
      prev = novo;
    }
    out[cod] = eop;
  });
  return out;
}

function simulacaoSemanal(){
  // Aplica curva por quarter, distribuindo entrada na semana
  const out = {};
  state.skus.forEach(sku => {
    const cod = sku.cod_item;
    const upp = sku.upp_efetiva;
    const estIni = state.estoque[cod] || 0;
    const eop = new Array(52).fill(0);
    // Histórico (sem 1..PRIMEIRA_SIM): estoque constante
    for(let w = 0; w < PRIMEIRA_SIM; w++) eop[w] = estIni;

    // Simulação real começa em w = PRIMEIRA_SIM (Jun-S1)
    let prev = estIni;
    for(let w = PRIMEIRA_SIM; w < 52; w++){
      const info = MAPA_SEMANAS[w];
      const q = info.q;
      const mesIdx = info.mesIdx;
      const semNoMes = info.semNoMes;
      const posNoQ = info.posNoQ;

      // Saída do quarter inteiro × % curva
      const meses_do_q = [(q-1)*3+1, (q-1)*3+2, (q-1)*3+3];
      const saidaQ = meses_do_q.reduce((s, mi) =>
        s + ((state.saidas[cod] && state.saidas[cod][mi]) || 0), 0);
      const pctCurva = (state.curva[sku.empresa] && state.curva[sku.empresa][q] &&
                       state.curva[sku.empresa][q][posNoQ - 1]) || 0;
      const saidaSemana = saidaQ * pctCurva;

      // Entrada do mês × % entrada da semana_no_mes
      const entMes = (state.entradas[cod] && state.entradas[cod][mesIdx]) || 0;
      const pctEntrada = state.parametros[`entrada_s${semNoMes}`] || 0;
      const entradaSemana = entMes * pctEntrada;

      const novo = Math.max(prev + entradaSemana - saidaSemana, 0);
      eop[w] = novo;
      prev = novo;
    }
    out[cod] = eop;
  });
  return out;
}

function agregadoMensal(simul){
  // Retorna por empresa: PP por mês [12]
  const out = {GENOMMA: new Array(12).fill(0), INOVALAB: new Array(12).fill(0)};
  state.skus.forEach(sku => {
    const emp = sku.empresa;
    const upp = sku.upp_efetiva;
    const eop = simul[sku.cod_item] || [];
    for(let m = 0; m < 12; m++){
      out[emp][m] += calcularPP(eop[m] || 0, upp);
    }
  });
  return out;
}

function agregadoSemanal(simul){
  const out = {GENOMMA: new Array(52).fill(0), INOVALAB: new Array(52).fill(0)};
  state.skus.forEach(sku => {
    const emp = sku.empresa;
    const upp = sku.upp_efetiva;
    const eop = simul[sku.cod_item] || [];
    for(let w = 0; w < 52; w++){
      out[emp][w] += calcularPP(eop[w] || 0, upp);
    }
  });
  return out;
}

function getStatus(pct, isHist){
  if(isHist) return 'OK';
  if(pct >= 1)    return 'OVERFLOW';
  if(pct >= 0.9)  return 'ATENÇÃO';
  return 'OK';
}

function statusClass(s){
  if(s === 'OVERFLOW') return 'cell-red';
  if(s === 'ATENÇÃO')  return 'cell-yellow';
  if(s === 'OK')       return 'cell-green';
  return '';
}

function fmt(n){
  if(n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:0});
}
function pct(n){
  if(n === null || n === undefined) return '';
  return (n * 100).toFixed(1) + '%';
}

  {id:'cadastro',   label:'Cadastro SKU',        edit:true},
  {id:'sop',        label:'S&OP',                edit:true},

function renderTabs(){
  const html = TABS.map(t =>
    `<button class="tab ${t.edit?'tab-edit':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
  document.getElementById('tabs').innerHTML = html;
}

function switchTab(tabId){
  state.activeTab = tabId;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
  renderActiveTab();
}

function renderActiveTab(){

function renderPainel(){
  const simM = simulacaoMensal();
  const simW = simulacaoSemanal();
  const aggM = agregadoMensal(simM);
  const aggW = agregadoSemanal(simW);
  const capG = state.parametros.cap_genomma;
  const capI = state.parametros.cap_inovalab;

  // KPIs
  const picoMG = Math.max(...aggM.GENOMMA.slice(5));
  const picoMI = Math.max(...aggM.INOVALAB.slice(5));
  const picoSG = Math.max(...aggW.GENOMMA.slice(PRIMEIRA_SIM));
  const picoSI = Math.max(...aggW.INOVALAB.slice(PRIMEIRA_SIM));
  const ovfMG = aggM.GENOMMA.slice(5).filter(v => v/capG >= 1).length;
  const ovfMI = aggM.INOVALAB.slice(5).filter(v => v/capI >= 1).length;
  const ovfSG = aggW.GENOMMA.slice(PRIMEIRA_SIM).filter(v => v/capG >= 1).length;
  const ovfSI = aggW.INOVALAB.slice(PRIMEIRA_SIM).filter(v => v/capI >= 1).length;
  const idxPicoSG = aggW.GENOMMA.indexOf(picoSG);
  const idxPicoSI = aggW.INOVALAB.indexOf(picoSI);

  let html = '';

  // Banner se está usando seed em memória (sem persistência)
  if(state._usandoSeed){
    html += `
    <div class="alert alert-warn" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div>⚠ <strong>Dados em memória (seed embutido).</strong> O banco Supabase está vazio ou inacessível.
      ${isAdmin
        ? 'Edições não vão persistir até que o seed seja salvo no banco.'
        : 'Peça ao admin (' + ADMIN_EMAIL + ') para acessar a página — ele gravará os dados no banco automaticamente.'}</div>
      ${isAdmin ? `<button class="btn btn-primary" onclick="forcarGravarSeed()">📥 Gravar dados no banco agora</button>` : ''}
    </div>`;
  }

  // Banner se tem SKUs mas faltam dados de S&OP, Forecast ou Estoque
  if(!state._usandoSeed && (state.skus.length > 0)){
    const semSaidas = Object.keys(state.saidas).length === 0;
    const semEntradas = Object.keys(state.entradas).length === 0;
    const semEstoque = Object.keys(state.estoque).length === 0;
    if(semSaidas || semEntradas || semEstoque){
      html += `
      <div class="alert alert-warn" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>⚠ <strong>Dados incompletos no banco.</strong>
        ${semEstoque ? 'Estoque vazio. ' : ''}
        ${semSaidas ? 'S&OP vazio. ' : ''}
        ${semEntradas ? 'Forecast vazio. ' : ''}
        ${isAdmin ? 'Clique no botão ao lado para reaplicar os dados do Excel.' : 'Avise o admin (' + ADMIN_EMAIL + ').'}</div>
        ${isAdmin ? `<button class="btn btn-primary" onclick="forcarGravarSeed()">📥 Reaplicar dados do Excel</button>` : ''}
      </div>`;
    }
  }

  html += `
    <!-- Capacidades editáveis -->
    <div class="cap-box">
      <div class="cap-item"><strong>Capacidade Genomma:</strong>
        <input type="number" class="cap-input" value="${capG}" ${isAdmin?'':'disabled'}
               onchange="saveParam('cap_genomma', this.value)"> PP</div>
      <div class="cap-item"><strong>Capacidade Inovalab:</strong>
        <input type="number" class="cap-input" value="${capI}" ${isAdmin?'':'disabled'}
               onchange="saveParam('cap_inovalab', this.value)"> PP</div>
      <div class="cap-item"><strong>Safety %:</strong>
        <input type="number" class="cap-input" value="${(state.parametros.safety_pct*100).toFixed(0)}" step="1" min="0" max="100" ${isAdmin?'':'disabled'}
               onchange="saveParam('safety_pct', this.value/100)">%</div>
      <div class="cap-item" style="margin-left:auto;color:var(--text2);font-size:11px">
        ${isAdmin ? '✏ Você pode editar (admin)' : '🔒 Somente leitura'}
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi ${ovfMG>0?'danger':(picoMG/capG>=0.9?'warn':'')}">
        <div class="kpi-label">Genomma · pico mensal</div>
        <div class="kpi-value">${fmt(picoMG)} <span style="font-size:12px;font-weight:400">PP</span></div>
        <div class="kpi-sub">${pct(picoMG/capG)} · ${ovfMG} meses em overflow</div>
      </div>
      <div class="kpi ${ovfSG>0?'danger':(picoSG/capG>=0.9?'warn':'')}">
        <div class="kpi-label">Genomma · pico semanal</div>
        <div class="kpi-value">${fmt(picoSG)} <span style="font-size:12px;font-weight:400">PP</span></div>
        <div class="kpi-sub">${pct(picoSG/capG)} · ${MAPA_SEMANAS[idxPicoSG]?.label||'-'} · ${ovfSG} semanas overflow</div>
      </div>
      <div class="kpi ${ovfMI>0?'danger':(picoMI/capI>=0.9?'warn':'')}">
        <div class="kpi-label">Inovalab · pico mensal</div>
        <div class="kpi-value">${fmt(picoMI)} <span style="font-size:12px;font-weight:400">PP</span></div>
        <div class="kpi-sub">${pct(picoMI/capI)} · ${ovfMI} meses em overflow</div>
      </div>
      <div class="kpi ${ovfSI>0?'danger':(picoSI/capI>=0.9?'warn':'')}">
        <div class="kpi-label">Inovalab · pico semanal</div>
        <div class="kpi-value">${fmt(picoSI)} <span style="font-size:12px;font-weight:400">PP</span></div>
        <div class="kpi-sub">${pct(picoSI/capI)} · ${MAPA_SEMANAS[idxPicoSI]?.label||'-'} · ${ovfSI} semanas overflow</div>
      </div>
    </div>
  `;

  // Gráfico mensal
  html += `
    <div class="panel">
      <div class="panel-title">Projeção Mensal — PP por empresa</div>
      <div class="panel-sub">Jan-Mai = histórico (foto do estoque atual) · Jun-Dez = simulação</div>
      <div style="position:relative;height:280px"><canvas id="chartM"></canvas></div>
    </div>
  `;

  // Tabela mensal por empresa
  html += `<div class="panel"><div class="panel-title">Detalhe Mensal</div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th>Empresa</th><th>Métrica</th>
        ${MESES_PT.map((m,i)=>`<th class="q${QUARTER_OF_MES[i]}">${MESES_ABR[i]}</th>`).join('')}
        <th>Pico</th><th>Mês</th></tr></thead><tbody>`;
  ['GENOMMA','INOVALAB'].forEach(emp => {
    const cap = emp === 'GENOMMA' ? capG : capI;
    const ppArr = aggM[emp];
    const pctArr = ppArr.map(v => v/cap);
    const stArr = pctArr.map((p,i) => getStatus(p, i < 5));
    const pico = Math.max(...ppArr.slice(5));
    const idx = ppArr.indexOf(pico);
    html += `<tr><td rowspan="3" class="center"><strong>${emp}</strong></td>
      <td>PP</td>${ppArr.map(v=>`<td class="num"><strong>${fmt(v)}</strong></td>`).join('')}
      <td class="num"><strong>${fmt(pico)}</strong></td><td class="center"><strong>${MESES_ABR[idx]}</strong></td></tr>`;
    html += `<tr><td>% ocup.</td>${pctArr.map((p,i)=>{
      const cls = i < 5 ? 'cell-gray' : statusClass(stArr[i]);
      return `<td class="num ${cls}">${pct(p)}</td>`;
    }).join('')}<td></td><td></td></tr>`;
    html += `<tr><td>Status</td>${stArr.map((s,i)=>{
      const cls = i < 5 ? 'cell-gray' : statusClass(s);
      return `<td class="center ${cls}">${s}</td>`;
    }).join('')}<td></td><td></td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  // Gráfico semanal
  html += `
    <div class="panel">
      <div class="panel-title">Projeção Semanal — PP por empresa (52 semanas)</div>
      <div class="panel-sub">Sem 1-21 = histórico · Sem 22-52 = simulação com curva por quarter</div>
      <div style="position:relative;height:300px"><canvas id="chartS"></canvas></div>
    </div>
  `;

  // Resumo executivo
  html += `<div class="panel"><div class="panel-title">Resumo executivo</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Indicador</th><th>Genomma</th><th>Inovalab</th></tr></thead>
      <tbody>
        <tr><td>Pico mensal (PP)</td><td class="num">${fmt(picoMG)}</td><td class="num">${fmt(picoMI)}</td></tr>
        <tr><td>Pico semanal (PP)</td><td class="num">${fmt(picoSG)}</td><td class="num">${fmt(picoSI)}</td></tr>
        <tr><td>Diferença semanal vs mensal</td><td class="num">+${fmt(picoSG-picoMG)}</td><td class="num">+${fmt(picoSI-picoMI)}</td></tr>
        <tr><td>Meses em overflow</td><td class="num">${ovfMG}</td><td class="num">${ovfMI}</td></tr>
        <tr><td>Semanas em overflow</td><td class="num">${ovfSG}</td><td class="num">${ovfSI}</td></tr>
      </tbody>
    </table></div></div>`;

  document.getElementById('content').innerHTML = html;

  // Charts
  drawChart('chartM', MESES_ABR, aggM.GENOMMA, aggM.INOVALAB, capG, capI, 'bar');
  drawChart('chartS', MAPA_SEMANAS.map(s=>s.label), aggW.GENOMMA, aggW.INOVALAB, capG, capI, 'line');
}

function drawChart(canvasId, labels, dataG, dataI, capG, capI, type){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  const colG = dataG.map((v,i) => {
    if(type==='line') return '#378ADD';
    if(i<5) return '#9EBED9';  // histórico, mais claro
    return v >= capG ? '#A32D2D' : (v/capG >= 0.9 ? '#EF9F27' : '#378ADD');
  });
  const colI = dataI.map((v,i) => {
    if(type==='line') return '#1D9E75';
    if(i<5) return '#A0CEB8';
    return v >= capI ? '#A32D2D' : (v/capI >= 0.9 ? '#EF9F27' : '#1D9E75');
  });
  new Chart(ctx, {
    type: type,
    data: {
      labels,
      datasets: [
        {label:'Genomma', data:dataG, backgroundColor:colG, borderColor:'#378ADD', borderWidth:type==='line'?2:0, pointRadius:type==='line'?2:0, tension:0.15, fill:false},
        {label:'Inovalab', data:dataI, backgroundColor:colI, borderColor:'#1D9E75', borderWidth:type==='line'?2:0, borderDash:type==='line'?[4,2]:[], pointRadius:type==='line'?2:0, tension:0.15, fill:false},
        {label:'Cap Genomma', type:'line', data:Array(labels.length).fill(capG), borderColor:'#185FA5', borderDash:[6,4], borderWidth:1.2, pointRadius:0, fill:false},
        {label:'Cap Inovalab', type:'line', data:Array(labels.length).fill(capI), borderColor:'#0F6E56', borderDash:[6,4], borderWidth:1.2, pointRadius:0, fill:false},
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},
        tooltip:{callbacks:{label:(ctx)=>{
          const cap = ctx.dataset.label.includes('Genomma') ? capG : capI;
          if(ctx.dataset.label.startsWith('Cap')) return `${ctx.dataset.label}: ${cap}`;
          return `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('pt-BR')} PP (${(ctx.parsed.y/cap*100).toFixed(1)}%)`;
        }}}},
      scales:{
        y:{beginAtZero:true,ticks:{font:{size:10}}},
        x:{ticks:{font:{size:9},maxRotation: type==='line'?60:0,minRotation: type==='line'?60:0}}
      }
    }
  });
}

}

// Força reaplicar seed do Excel embutido no HTML (admin only)
async function forcarGravarSeed(){
  if(!isAdmin){ alert('Apenas o admin pode reaplicar os dados.'); return; }
  const seed = lerSeed();
  if(!seed){ alert('Seed não encontrado no HTML.'); return; }
  if(!confirm('Isso vai SUBSTITUIR todos os dados de SKU/S&OP/Forecast/Estoque/Curva no banco com os dados do Excel embutido. Continuar?')) return;

  // Mostrar feedback de carregamento
  const content = document.getElementById('content');
  const original = content.innerHTML;
  content.innerHTML = `<div class="loading"><div class="spinner"></div>Gravando dados do Excel no Supabase…</div>`;

  try{
    const gravou = await gravarSeedNoSupabase(seed);
    if(gravou){
      alert('✓ Dados do Excel gravados no banco com sucesso! Recarregando…');
      state._usandoSeed = false;
      await loadAll();
    } else {
      content.innerHTML = original;
      alert('✗ Falha ao gravar. Verifique se as tabelas existem no Supabase e se as policies de RLS permitem escrita para ' + ADMIN_EMAIL + '. Veja o console (F12) para detalhes.');
    }
  }catch(e){
    content.innerHTML = original;
    alert('Erro: ' + e.message);
    console.error(e);
  }
}

async function saveParam(chave, valor){
  if(!isAdmin) return alert('Apenas o admin pode editar.');
  state.parametros[chave] = parseFloat(valor);
  await sb.from('sop_meta').upsert({chave, valor: String(valor), user_email: currentUser.email}, {onConflict:'chave'});
  // Re-renderiza qualquer aba que dependa de parâmetros
  renderActiveTab();
}

async function saveSKU(cod_item, campo, valor){
  if(!isAdmin) return;
  const sku = state.skus.find(s => s.cod_item === cod_item);
  if(!sku) return;
  if(campo === 'upp_override'){
    const v = parseInt(valor) || null;
    sku.upp_override = v;
    sku.upp_efetiva = v || sku.upp_cadastro || 2000;
    await sb.from('sop_sku').update({upp_override: v, upp_efetiva: sku.upp_efetiva}).eq('cod_item', cod_item);
  } else if(campo === 'status_supply'){
    sku.status_supply = valor || null;
    await sb.from('sop_sku').update({status_supply: valor || null}).eq('cod_item', cod_item);
    renderActiveTab();  // re-renderizar para atualizar alertas de Desativado
  }
}

async function savePlano(tabela, cod_item, mes, valor){
  if(!isAdmin) return;
  const v = parseFloat(valor) || 0;
  const ref = tabela === 'sop_plano_saida' ? state.saidas : state.entradas;
  if(!ref[cod_item]) ref[cod_item] = {};
  ref[cod_item][mes] = v;
  const ym = `2026-${String(mes).padStart(2,'0')}-01`;
  if(v > 0){
    await sb.from(tabela).upsert({cod_item, year_month: ym, qty_un: v, horizonte:'2026'},
      {onConflict:'cod_item,year_month,horizonte'});
  } else {
    await sb.from(tabela).delete().eq('cod_item', cod_item).eq('year_month', ym).eq('horizonte','2026');
  }
}

async function saveEstoque(cod_item, valor){
  if(!isAdmin) return;
  const v = parseFloat(valor) || 0;
  state.estoque[cod_item] = v;
  const today = new Date().toISOString().slice(0,10);
  await sb.from('sop_estoque').upsert({cod_item, snapshot_date: today, qty_un: v},
    {onConflict:'cod_item,snapshot_date'});
}

async function saveCurva(empresa, quarter, semana, valor){
  if(!isAdmin) return;
  const v = parseFloat(valor) || 0;
  if(!state.curva[empresa]) state.curva[empresa] = {};
  if(!state.curva[empresa][quarter]) state.curva[empresa][quarter] = new Array(13).fill(0);
  state.curva[empresa][quarter][semana - 1] = v;
  await sb.from('sop_curva_quarter').upsert(
    {empresa, quarter, semana_no_quarter: semana, pct: v},
    {onConflict:'empresa,quarter,semana_no_quarter'});
  renderActiveTab();
}

function baixarTemplate(aba){
  let data = [], filename = '', sheetName = '';

  if(aba === 'cadastro'){
    sheetName = 'Cadastro SKU';
    filename = 'template_cadastro_sku.xlsx';
    data = state.skus.map(s => ({
      'Cod Item': s.cod_item, 'Descrição': s.descricao, 'Marca': s.marca, 'Empresa': s.empresa,
      'UPP Cadastro': s.upp_cadastro, 'UPP Override': s.upp_override,
      'Status Supply': s.status_supply, 'GTIN14': s.gtin14
    }));
  } else if(aba === 'sop' || aba === 'forecast'){
    sheetName = aba === 'sop' ? 'S&OP' : 'Forecast Pedidos';
    filename = `template_${aba}.xlsx`;
    const ref = aba === 'sop' ? state.saidas : state.entradas;
    data = state.skus.map(s => {
      const row = {'Cod Item': s.cod_item, 'Descrição': s.descricao, 'Empresa': s.empresa};
      MESES_PT.forEach((m,i) => row[m] = (ref[s.cod_item] && ref[s.cod_item][i+1]) || 0);
      return row;
    });
  } else if(aba === 'estoque'){
    sheetName = 'Estoque Atual';
    filename = 'template_estoque.xlsx';
    data = state.skus.map(s => ({
      'Cod Item': s.cod_item, 'Descrição': s.descricao, 'Empresa': s.empresa,
      'Status Supply': s.status_supply, 'Estoque Atual (UN)': state.estoque[s.cod_item] || 0
    }));
  } else if(aba === 'curva'){
    sheetName = 'Curva por Quarter';
    filename = 'template_curva.xlsx';
    ['GENOMMA','INOVALAB'].forEach(emp => {
      [1,2,3,4].forEach(q => {
        const row = {'Empresa': emp, 'Quarter': `Q${q}`};
        const curva = (state.curva[emp] && state.curva[emp][q]) || [];
        for(let s = 1; s <= 13; s++) row[`Sem ${s}`] = (curva[s-1] || 0);
        data.push(row);
      });
    });
  }

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}

async function uploadAba(aba, input){
  if(!isAdmin){ alert('Apenas admin pode subir arquivos.'); return; }
  const file = input.files[0];
  if(!file) return;
  if(!confirm(`Upload de ${aba}? Os dados serão substituídos no banco.`)) return;
  try{
    const reader = new FileReader();
    const buf = await new Promise((res,rej)=>{
      reader.onload = e => res(e.target.result);
      reader.onerror = rej;
      reader.readAsArrayBuffer(file);
    });
    const wb = XLSX.read(buf, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:null});

    if(aba === 'cadastro'){
      const payload = rows.filter(r => r['Cod Item']).map(r => ({
        cod_item: String(r['Cod Item']),
        descricao: r['Descrição'] || r['Descricao'] || '',
        marca: r['Marca'] || '',
        empresa: r['Empresa'] || 'GENOMMA',
        upp_cadastro: parseInt(r['UPP Cadastro']) || null,
        upp_override: parseInt(r['UPP Override']) || null,
        upp_efetiva: parseInt(r['UPP Override']) || parseInt(r['UPP Cadastro']) || 2000,
        status_supply: r['Status Supply'] || null,
        gtin14: r['GTIN14'] ? String(r['GTIN14']) : null
      }));
      await sb.from('sop_sku').upsert(payload, {onConflict:'cod_item'});
      alert(`✓ ${payload.length} SKUs atualizados.`);
    } else if(aba === 'sop' || aba === 'forecast'){
      const tabela = aba === 'sop' ? 'sop_plano_saida' : 'sop_plano_entrada';

      // Parser numérico brasileiro: aceita "1.234,56", "778,8", "1234.56", número direto
      const parseNum = (v) => {
        if(v === null || v === undefined || v === '') return 0;
        if(typeof v === 'number') return v;
        // Remove pontos de milhar e troca vírgula por ponto decimal
        const s = String(v).trim().replace(/\./g, '').replace(',', '.');
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
      };

      // Coletar todos cod_item presentes no upload + valores > 0
      const codsNoUpload = new Set();
      const payload = [];
      const stats = {GENOMMA: {linhas: 0, valor: 0}, INOVALAB: {linhas: 0, valor: 0}, OUTROS: {linhas: 0, valor: 0}};

      rows.filter(r => r['Cod Item'] && r['Cod Item'] !== 'TOTAL').forEach(r => {
        const cod = String(r['Cod Item']).trim();
        codsNoUpload.add(cod);
        // Detectar empresa pelo VLOOKUP no state ou direto na linha
        let emp = r['Empresa'];
        if(!emp){
          const sku = state.skus.find(s => s.cod_item === cod);
          emp = sku?.empresa || 'OUTROS';
        }
        if(!stats[emp]) stats[emp] = {linhas: 0, valor: 0};

        MESES_PT.forEach((mes, i) => {
          const v = parseNum(r[mes]);
          if(v > 0){
            payload.push({
              cod_item: cod,
              year_month: `2026-${String(i+1).padStart(2,'0')}-01`,
              qty_un: v,
              horizonte: '2026'
            });
            stats[emp].linhas++;
            stats[emp].valor += v;
          }
        });
      });

      const cods = Array.from(codsNoUpload);
      console.log(`[upload-${aba}] SKUs no arquivo: ${cods.length}, payload: ${payload.length} linhas com valor > 0`);
      console.log(`[upload-${aba}] Por empresa:`, stats);

      // Apaga só os cod_item que estão no upload (preserva os outros)
      // Em lotes de 100 para evitar URL muito longa
      for(let i = 0; i < cods.length; i += 100){
        const lote = cods.slice(i, i+100);
        const {error: dErr} = await sb.from(tabela).delete()
          .eq('horizonte', '2026').in('cod_item', lote);
        if(dErr) console.error(`[upload-${aba}] delete lote ${i/100+1}:`, dErr);
      }

      // Insere em lotes de 500
      let inseridos = 0;
      for(let i = 0; i < payload.length; i += 500){
        const lote = payload.slice(i, i+500);
        const {error: iErr} = await sb.from(tabela).insert(lote);
        if(iErr){
          console.error(`[upload-${aba}] insert lote ${i/500+1}:`, iErr);
          throw new Error(`Falha ao inserir lote ${i/500+1}: ${iErr.message}`);
        }
        inseridos += lote.length;
      }

      // Resumo amigável
      const resumoLinhas = Object.entries(stats)
        .filter(([_, s]) => s.linhas > 0)
        .map(([emp, s]) => `${emp}: ${s.linhas} pontos (${s.valor.toLocaleString('pt-BR',{maximumFractionDigits:0})} UN)`)
        .join('\n');
      alert(`✓ Upload concluído!\n\n` +
            `Tabela: ${tabela}\n` +
            `SKUs no arquivo: ${cods.length}\n` +
            `Pontos inseridos: ${inseridos}\n\n` +
            `Por empresa:\n${resumoLinhas || '(nenhum valor > 0 no arquivo!)'}`);
    } else if(aba === 'estoque'){
      const today = new Date().toISOString().slice(0,10);
      const parseNum = (v) => {
        if(v === null || v === undefined || v === '') return 0;
        if(typeof v === 'number') return v;
        const s = String(v).trim().replace(/\./g, '').replace(',', '.');
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
      };
      const payload = rows.filter(r => r['Cod Item']).map(r => ({
        cod_item: String(r['Cod Item']).trim(),
        snapshot_date: today,
        qty_un: parseNum(r['Estoque Atual (UN)'])
      }));
      const {error} = await sb.from('sop_estoque').upsert(payload, {onConflict:'cod_item,snapshot_date'});
      if(error) throw error;
      alert(`✓ ${payload.length} linhas de estoque atualizadas.`);
    } else if(aba === 'curva'){
      const payload = [];
      rows.forEach(r => {
        const emp = r['Empresa']; const q = parseInt(String(r['Quarter']).replace('Q',''));
        if(!emp || !q) return;
        for(let s = 1; s <= 13; s++){
          const v = parseFloat(r[`Sem ${s}`]) || 0;
          if(v > 0) payload.push({empresa: emp, quarter: q, semana_no_quarter: s, pct: v});
        }
      });
      await sb.from('sop_curva_quarter').delete().gte('quarter', 1);
      await sb.from('sop_curva_quarter').insert(payload);
      alert(`✓ Curva atualizada (${payload.length} linhas).`);
    }
    input.value = '';
    await loadAll();
  }catch(e){
    alert('Erro: ' + e.message);
    console.error(e);
  }
}
