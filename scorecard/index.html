<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecard Logístico — Torre de Controle</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --genomma-900:#0B2A55;--genomma-700:#134E86;--genomma:#185FA5;--genomma-500:#1E6FC0;
    --genomma-400:#37A0D8;--genomma-300:#7CC6E8;--genomma-200:#C7E0F4;--genomma-100:#E8F2FB;
    --ink:#12222F;--ink-soft:#5B6B78;--line:#E3EAF0;--bg:#F5F8FB;--card:#FFF;
    --alert:#E4572E;--warn:#E5A50A;--ok:#1F9E6E;
    --radius:16px;--shadow:0 1px 2px rgba(16,45,70,.04),0 8px 24px rgba(16,45,70,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;background:linear-gradient(100deg,var(--genomma-900),var(--genomma) 72%);color:#fff;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center}
  .brand small{display:block;font-weight:500;opacity:.78;font-size:11px}
  .topbar .spacer{flex:1}
  .btn{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-ghost{background:rgba(255,255,255,.16);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.26)}
  .btn-primary{background:#fff;color:var(--genomma-900)}.btn-primary:hover{background:var(--genomma-100)}
  .tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;position:sticky;top:58px;z-index:30}
  .tab{display:flex;align-items:center;gap:8px;padding:14px 15px;border:0;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
  .tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .tab:hover{color:var(--genomma)} .tab.active{color:var(--genomma);border-bottom-color:var(--genomma)}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 22px}
  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .dim-head{display:flex;align-items:baseline;gap:10px}.dim-head h2{margin:0;font-size:18px}.dim-head span{color:var(--ink-soft);font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}.filters label{color:var(--ink-soft);font-size:12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);transition:.15s;user-select:none;display:flex;align-items:center;gap:6px}
  .chip .sw{width:9px;height:9px;border-radius:50%}.chip.on{background:var(--genomma);border-color:var(--genomma);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--barc,var(--genomma))}
  .kpi .lbl{color:var(--ink-soft);font-size:12px;font-weight:600;min-height:30px}
  .kpi .val{font-size:26px;font-weight:750;margin:6px 0 2px}.kpi .val small{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .kpi .delta{font-size:11px;font-weight:600}.up{color:var(--ok)}.down{color:var(--alert)}.warnc{color:var(--warn)}.flat{color:var(--ink-soft)}
  .kpi .tag{position:absolute;top:12px;right:14px;font-size:10px;color:var(--ink-soft);background:var(--genomma-100);border-radius:20px;padding:2px 7px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .panel.full{grid-column:1/-1}
  .wkbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--genomma-100);
    border:1px solid var(--genomma-200);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .wkbar .it{display:flex;flex-direction:column;gap:1px}
  .wkbar .it b{font-size:15px;color:var(--genomma-900);letter-spacing:-.3px}
  .wkbar .it span{font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .wkbar .sep{width:1px;height:26px;background:var(--genomma-200)}
  .wkbar .pos{color:var(--ok)} .wkbar .neg{color:var(--alert)}
  .panel .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .panel h3{margin:0;font-size:14px}.panel .sub{margin:2px 0 0;color:var(--ink-soft);font-size:12px}
  .metatag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:8px}
  .metatag.has{background:var(--genomma-100);color:var(--genomma-700)}.metatag.no{background:#F1F0EE;color:var(--ink-soft)}
  .metatag i{width:7px;height:7px;border-radius:50%}
  .modes{display:flex;gap:3px;background:var(--genomma-100);border-radius:9px;padding:3px}
  .modes button{border:0;background:transparent;color:var(--genomma-700);font-family:inherit;font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.12s}
  .modes button.on{background:#fff;color:var(--genomma);box-shadow:0 1px 2px rgba(16,45,70,.12)}
  .about{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .about summary{cursor:pointer;color:var(--genomma);font-size:12px;font-weight:600;list-style:none}
  .about summary::-webkit-details-marker{display:none}
  .about summary::before{content:"▸ ";font-size:10px}.about[open] summary::before{content:"▾ "}
  .about p{margin:6px 0 0;color:var(--ink-soft);font-size:12px;line-height:1.5}
  .overlay{position:fixed;inset:0;background:rgba(11,42,85,.4);display:none;align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(2px)}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:18px;width:min(980px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(11,42,85,.3)}
  .modal header{position:sticky;top:0;background:#fff;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal header h2{margin:0;font-size:16px}.modal .body{padding:18px 22px}
  .modal footer{position:sticky;bottom:0;background:#fff;padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .gridform{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;margin-bottom:12px;align-items:end}
  .f{display:flex;flex-direction:column;gap:4px}.f label{font-size:11px;color:var(--ink-soft);font-weight:600}
  select,input[type=number],input[type=text]{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}
  .meta-box{display:flex;align-items:center;gap:10px;background:var(--genomma-100);border:1px solid var(--genomma-200);border-radius:12px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
  .meta-box .mlab{font-size:12px;font-weight:700;color:var(--genomma-900)}
  .meta-box input{width:120px}
  .meta-box .sig{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .sig.on{background:#E4F6EE;color:var(--ok)}.sig.off{background:#F1F0EE;color:var(--ink-soft)}
  .sig i{width:8px;height:8px;border-radius:50%}
  .month-table{width:100%;border-collapse:collapse;margin-top:6px}
  .month-table th,.month-table td{border:1px solid var(--line);padding:5px;text-align:center;font-size:12px}
  .month-table th{background:var(--genomma-100);color:var(--genomma-900)}
  .month-table input{width:74px;border:1px solid var(--line);border-radius:6px;padding:4px;text-align:right}
  .hint{font-size:11px;color:var(--ink-soft)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--genomma-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1}
  .empty{color:var(--ink-soft);font-size:12px;text-align:center;padding:40px 10px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.gridform{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot">◧</span><div>Scorecard Logístico<small>Torre de Controle · Genomma Lab</small></div></div>
  <a class="btn btn-ghost" href="../index.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">‹ Torre</a>
  <div class="spacer"></div>
  <span class="btn btn-ghost" id="admBadge" style="display:none;cursor:pointer">🔓 Edição ativa</span>
  <button class="btn btn-ghost" id="btnLogin">Entrar para editar</button>
  <button class="btn btn-ghost" id="btnProj">Projetar ▸</button>
  <button class="btn btn-primary" id="btnEdit">Lançar / editar dados</button>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="wrap">
  <div class="filters">
    <div class="dim-head"><h2 id="dimNome">—</h2><span id="dimSub"></span></div>
    <span style="flex:1"></span>
    <label>Anos:</label><div class="chips" id="yearChips"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" id="panels"></div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <header><h2>Lançar / editar dados</h2>
      <button class="btn btn-primary" id="btnClose">Fechar ✕</button></header>
    <div class="body">
      <div class="gridform">
        <div class="f"><label>Indicador</label><select id="edInd"></select></div>
        <div class="f"><label>Ano</label><select id="edAno"></select></div>
        <div class="f"><label>Projetar a partir de</label><select id="edProjFrom"></select></div>
        <div class="f"><button class="btn btn-primary" style="background:var(--genomma);color:#fff" id="btnFillProj">Preencher projeção</button></div>
      </div>
      <div class="meta-box">
        <span class="mlab">Meta do indicador</span>
        <input type="number" step="any" id="edMeta" placeholder="ex.: 95">
        <span id="edMetaUnit" class="hint"></span>
        <span id="edMetaSig" class="sig off"><i></i>sem meta</span>
        <span class="hint" style="flex:1;min-width:180px">Deixe vazio para <b>não exibir linha de meta</b> no gráfico.</span>
      </div>
      <p class="hint">Edite os meses (na unidade exibida). "Pré-visualizar" aplica meta + valores nos gráficos sem salvar.</p>
      <div style="overflow:auto"><table class="month-table" id="edTable"></table></div>
    </div>
    <footer><span class="hint" id="edStatus" style="flex:1;min-width:220px;line-height:1.5">—</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" style="background:var(--genomma-100);color:var(--genomma-900)" id="btnDiag">Testar conexão</button>
        <button class="btn btn-primary" style="background:var(--genomma-100);color:var(--genomma-900)" id="btnPreview">Pré-visualizar</button>
        <button class="btn btn-primary" style="background:var(--genomma-100);color:var(--genomma-900)" id="btnExport">Exportar dados.json</button>
        <button class="btn btn-primary" style="background:var(--genomma);color:#fff" id="btnSave">Salvar</button>
      </div>
    </footer>
  </div>
</div>
<div class="toast" id="toast"></div>

/* recalcula as razões a partir dos R$ reais */
/* Faturamento Líquido = Faturamento − Devolução (recalculado dos R$ reais) */
function recomputeFatliq(){
  const fl=DATA.fatliq_rs, fat=DATA.fat_rs, dev=DATA.dev_rs;
  if(!fl||!fat||!dev) return;
  const s={};
  Object.keys(fat.series).forEach(k=>{
    const f=fat.series[k], d=dev.series[k];
    if(f!=null) s[k]=+((f-(d||0)).toFixed(2));
  });
  fl.series=s; fl.calc='Faturamento − Devolução';
  const yy={}; Object.keys(s).forEach(k=>{const y=k.slice(0,4);yy[y]=(yy[y]||0)+s[k];});
  fl.yearly=yy;
  const ult=Object.keys(s).sort().pop();
  if(ult){ fl.last_month=ult; fl.last_val=s[ult]; }
}
/* Custos acumulados: para cada mês, Σcusto ÷ Σfaturamento do ano até ali (YTD) */
function recomputeCustoAcum(){
  const acums=[
    {id:'custo_op_ac',  num:'ctw_rs',     calc:'Σ Custo T&W ÷ Σ Faturamento (acumulado no ano)'},
    {id:'custo_tr_ac',  num:'ctransp_rs', calc:'Σ Custo de Transporte ÷ Σ Faturamento (acumulado no ano)'},
  ];
  const fat=DATA.fat_rs; if(!fat) return;
  acums.forEach(({id,num,calc})=>{
    const ind=DATA[id], comp=DATA[num];
    if(!ind||!comp) return;
    const anos=new Set(); Object.keys(fat.series).forEach(k=>anos.add(k.slice(0,4)));
    const s={};
    anos.forEach(y=>{ let sn=0, sd=0;
      for(let i=1;i<=12;i++){ const mm=String(i).padStart(2,'0'), k=`${y}-${mm}`;
        const c=comp.series[k], f=fat.series[k];
        if(f==null) continue;
        sn+=(c||0); sd+=f;
        if(sd) s[k]=+(sn/sd).toFixed(4);
      }
    });
    ind.series=s; ind.calc=calc;
    const ult=Object.keys(s).sort().pop();
    if(ult){ ind.last_month=ult; ind.last_val=s[ult]; }
  });
}
function recomputeRatios(){
  Object.entries(RATIOS).forEach(([id,r])=>{
    const ind=DATA[id]; if(!ind||!DATA[r.num]||!DATA[r.den]) return;
    const num=DATA[r.num].series, den=DATA[r.den].series, s={};
    Object.keys(num).forEach(k=>{ if(den[k]) s[k]=+(num[k]/den[k]).toFixed(4); });
    ind.series=s; ind.calc=`${DATA[r.num].label} ÷ ${DATA[r.den].label} (mês a mês); acumulado = Σ ÷ Σ`;
    const yy={}; Object.keys(s).forEach(k=>{const y=k.slice(0,4);(yy[y]=yy[y]||{n:0,d:0});yy[y].n+=num[k];yy[y].d+=den[k];});
    ind.yearly={}; Object.keys(yy).forEach(y=>{ if(yy[y].d) ind.yearly[y]=+(yy[y].n/yy[y].d).toFixed(4); });
  });
}
/* ---- indicadores SEMANAIS (chave "AAAA-Wnn") ---- */
const SEMANAS = Array.from({length:53},(_,i)=>i+1);
const WK = n => 'W'+String(n).padStart(2,'0');
function semanasDoAno(ind,y){ return SEMANAS.filter(w=>ind.series[`${y}-${WK(w)}`]!=null); }
function totalAno(ind,y){ return semanasDoAno(ind,y).reduce((a,w)=>a+ind.series[`${y}-${WK(w)}`],0); }
function janelaAno(ind,y){ const s=semanasDoAno(ind,y); return s.length?[1,s[s.length-1]]:null; }
/* última semana com dado no ano */
function ultimaSemana(ind,y){ const s=semanasDoAno(ind,y); return s.length? s[s.length-1] : null; }
/* soma de um ano restrita a uma janela de semanas (comparação justa de ano parcial) */
function totalJanela(ind,y,ini,fim){
  return SEMANAS.filter(w=>w>=ini&&w<=fim&&ind.series[`${y}-${WK(w)}`]!=null)
    .reduce((a,w)=>a+ind.series[`${y}-${WK(w)}`],0);
}
function anosSemanais(ind){ const s=new Set();

/* ano em curso? compara a ÚLTIMA SEMANA lançada com a do ano de referência,

function ehParcial(ind,y){
  const anos=anosSemanais(ind);
  if(y!==anos[anos.length-1]) return false;          // anos anteriores: fechados
  const uw=ultimaSemana(ind,y); if(uw==null) return true;
  const ref=anos.length>1 ? (ultimaSemana(ind,anos[anos.length-2])||52) : 52;
  return uw < Math.min(ref,52);            // 52 semanas já fecham o ano
}

/* último mês com dado (para os cards de razão) */
function ultimoMesAno(ind,y){ let k=null; MMI.forEach(mm=>{ if(ind.series[`${y}-${mm}`]!=null) k=`${y}-${mm}`; }); return k; }

/* In-Full = (Total − Fracionados) ÷ Total, quando as quantidades existem.
   Onde ainda não houver quantidade lançada, mantém o histórico já registrado. */
function recomputeInfull(){
  if(!DATA.infull||!DATA.ped_tot||!DATA.ped_frac) return;
  const tot=DATA.ped_tot.series, frac=DATA.ped_frac.series;
  Object.keys(tot).forEach(k=>{
    const t=tot[k], f=frac[k];
    if(t!=null && f!=null && t>0) DATA.infull.series[k]=+(((t-f)/t)).toFixed(4);
  });
  DATA.infull.calc='(Pedidos Total − Pedidos Fracionados) ÷ Pedidos Total';
  const s=DATA.infull.series, yy={};
  Object.keys(s).forEach(k=>{const y=k.slice(0,4);(yy[y]=yy[y]||[]).push(s[k]);});
  DATA.infull.yearly={}; Object.keys(yy).forEach(y=>DATA.infull.yearly[y]=+(yy[y].reduce((a,b)=>a+b,0)/yy[y].length).toFixed(4));
}

/* ---- OTIF corrigido: On Time × In-Full ---- */
function recomputeOtif(){
  if(!DATA.otif||!DATA.ontime||!DATA.fillrate) return;
  const ot=DATA.ontime.series, fr=DATA.fillrate.series, s={};
  Object.keys(ot).forEach(k=>{ if(ot[k]!=null && fr[k]!=null) s[k]=+(ot[k]*fr[k]).toFixed(4); });
  DATA.otif.series=s; DATA.otif.calc='On Time (OTD) × Fill Rate';
  // recalcula yearly e last_val do OTIF
  const yy={}; Object.keys(s).forEach(k=>{const y=k.slice(0,4);(yy[y]=yy[y]||[]).push(s[k]);});
  DATA.otif.yearly={}; Object.keys(yy).forEach(y=>DATA.otif.yearly[y]=+(yy[y].reduce((a,b)=>a+b,0)/yy[y].length).toFixed(4));
  const last=Object.keys(s).sort().pop(); if(last){DATA.otif.last_month=last;DATA.otif.last_val=s[last];}
}

/* ---- derivados de listas ---- */
function YEARS(){ const set=new Set();
  Object.values(DATA).forEach(ind=>{ if(ind.half)return; Object.keys(ind.series||{}).forEach(k=>{const y=k.slice(0,4); if(/^20\d\d$/.test(y)) set.add(y);}); });
  return [...set].sort();
}
function GROUPS(){ const g=[]; Object.values(DATA).forEach(ind=>{ if(ind.group && !g.includes(ind.group)) g.push(ind.group);}); return g; }
function indsDe(group){
  const all=Object.keys(DATA).filter(k=>DATA[k].group===group && !OCULTOS.includes(k));
  const ord=ORDEM[group]; if(!ord) return all;
  const pri=ord.filter(k=>all.includes(k));
  return [...pri, ...all.filter(k=>!pri.includes(k))];
}

let dimAtiva=(()=>{try{return localStorage.getItem("sc2-aba")||null;}catch(e){return null;}})(), modoPorInd=(()=>{try{return JSON.parse(localStorage.getItem("sc2-modos")||"{}");}catch(e){return{};}})();

/* ---- formatação ---- */
function isPct(ind){return ind.unit==='%';}
function scale(ind,v){return v==null?null:(isPct(ind)?v*100:v);}
function fmtRS(v){const a=Math.abs(v);return 'R$ '+(a>=1e6?(v/1e6).toFixed(2)+' Mi':a>=1e3?(v/1e3).toFixed(0)+' mil':v.toLocaleString('pt-BR',{maximumFractionDigits:0}));}
function fmtRSfull(v){return 'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtVal(ind,v){ if(v==null)return '—';
  if(ind.unit==='%') return (v*100).toFixed(1)+'%';
  if(ind.unit==='d') return v.toFixed(1)+' d';
  if(ind.unit==='rs') return fmtRS(v);
  return (+v).toLocaleString('pt-BR');
}
function fmtMeta(ind){ if(ind.target==null)return null;
  if(ind.unit==='%') return (ind.target*100).toFixed(ind.target<0.1?1:0)+'%';
  if(ind.unit==='d') return ind.target+' d';
  return ''+ind.target;
}
function serieAno(ind,y){ return MMI.map(mm=>{const v=ind.series[`${y}-${mm}`]; return v==null?null:v;}); }
function anosComDado(ind){ return YEARS().filter(y=>MMI.some(mm=>ind.series[`${y}-${mm}`]!=null)); }
function ultimoIdx(ind,y){ let last=-1; MMI.forEach((mm,i)=>{if(ind.series[`${y}-${mm}`]!=null)last=i;}); return last; }
function anualDe(ind,y){ if(ind.yearly && ind.yearly[y]!=null) return ind.yearly[y];
  const s=serieAno(ind,y).filter(v=>v!=null); return s.length? s.reduce((a,b)=>a+b,0)/s.length : null; }

/* ---- status vs meta ---- */
/* status: com meta/limite compara com ela; sem meta compara com a referência (ano anterior) */
function status(ind,v,ref){
  if(v==null) return 'na';
  if(ind.target!=null){ const t=ind.target;
    if(ind.limite) return v<=t?'ok':v<=t*1.05?'warn':'bad';       // limite (teto)
    if(ind.dir==='up')   return v>=t?'ok':v>=t*0.97?'warn':'bad';
    if(ind.dir==='down') return v<=t?'ok':v<=t*1.15?'warn':'bad';
    return Math.abs(v-t)<=t*0.06?'ok':Math.abs(v-t)<=t*0.12?'warn':'bad';
  }
  if(ref==null||ref===0) return 'na';
  const tol=Math.abs(ref)*0.01;                                   // variação < 1% = estável
  if(ind.dir==='up')   return v>=ref-tol?'ok':'warn';             // ex.: faturamento abaixo do ano anterior => laranja
  if(ind.dir==='down') return v<=ref+tol?'ok':'warn';             // ex.: custo acima do ano anterior => laranja
  return 'na';
}
const STCOR={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--alert)',na:'var(--ink-soft)'};

function renderKpis(){
  const box=document.getElementById("kpis"); box.innerHTML="";
  const anoAtual=[...anosSel].sort().pop(), anoAnt=String(+anoAtual-1);
  indsDe(dimAtiva).forEach(id=>{
    const ind=DATA[id];
    if(ind.weekly){
      const anos=anosSemanais(ind).filter(y=>anosSel.includes(y));
      const y=(anos.length?anos:anosSemanais(ind)).slice(-1)[0];
      const yAnt=String(+y-1);
      const uw=ultimaSemana(ind,y), parcial=ehParcial(ind,y);
      const cur=totalAno(ind,y);
      const prev = parcial && uw ? totalJanela(ind,yAnt,1,uw) : totalAno(ind,yAnt);
      let dTxt='—', cls='flat', seta='—';
      if(prev>0){ const p=(cur-prev)/prev*100; seta=p>0.05?'▲':p<-0.05?'▼':'—';
        cls = p>0.05?'up':p<-0.05?'warnc':'flat';
        dTxt=(p>=0?'+':'')+p.toFixed(1)+'% vs '+yAnt+(parcial?' (até S'+uw+')':''); }
      const nSem=semanasDoAno(ind,y).length;
      box.insertAdjacentHTML("beforeend",`
        <div class="kpi" style="--barc:${YEAR_COL[y]||'var(--genomma)'}">
          <div class="tag">${y}${parcial&&uw?` · até S${uw}`:''}</div>
          <div class="lbl">${ind.label}</div>
          <div class="val">${(cur/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}<small> Mi un</small></div>
          <span class="delta ${cls}">${seta} ${dTxt}</span>
          <div class="hint" style="margin-top:5px">${nSem} semanas · média ${Math.round(cur/Math.max(1,nSem)).toLocaleString('pt-BR')} un/sem</div>
        </div>`);
      return;
    }
    if(ind.half){
      const keys=Object.keys(ind.series).sort();
      const porAno={};
      keys.forEach(k=>{ const y=k.slice(0,4); porAno[y]=(porAno[y]||0)+ind.series[k]; });
      const anos=Object.keys(porAno).sort().reverse();
      const anoUlt=anos[0], vUlt=porAno[anoUlt], vAnt=anos[1]!=null?porAno[anos[1]]:null;
      let dTxt='—', dCls='flat', seta='—';
      if(vAnt!=null){ const dd=vUlt-vAnt; seta=dd>0?'▲':dd<0?'▼':'—';
        dCls = Math.abs(vUlt)<=Math.abs(vAnt)?'up':'warnc';
        dTxt=(dd>=0?'+':'−')+fmtRS(Math.abs(dd)).replace('R$ ','R$ ')+' vs '+anos[1]; }
      const legenda=anos.slice(0,4).map(y=>{
        const v=porAno[y], cor=v>0?'var(--genomma-500)':v<0?'var(--alert)':'var(--ink-soft)';
        return `<span style="white-space:nowrap"><b style="color:${cor}">${y}</b> ${fmtRS(v)}</span>`;
      }).join(' · ');
      box.insertAdjacentHTML("beforeend",`
        <div class="kpi" style="--barc:var(--genomma)">
          <div class="tag">${anoUlt}</div>
          <div class="lbl">${ind.label}</div>
          <div class="val">${fmtRSfull(vUlt)}</div>
          <span class="delta ${dCls}">${seta} ${dTxt}</span>
          <div class="hint" style="margin-top:5px;line-height:1.6">${legenda}</div>
        </div>`);
      return;
    }
    const ACUMS=['custo_op_ac','custo_tr_ac'];
    const ehUltimo = !!RATIOS[id] || ACUMS.includes(id);
    let cur, prev, refTag=anoAtual, notaRef='', baseTxt='', parcialAviso='';
    const mesesCur = MMI.filter(mm=>ind.series[`${anoAtual}-${mm}`]!=null);
    if(ehUltimo){
      /* último mês lançado — mês lançado é mês fechado, sem interpretação */
      const kAtual=ultimoMesAno(ind,anoAtual);
      cur = kAtual? ind.series[kAtual] : null;
      if(kAtual){ const kPrev=`${anoAnt}-${kAtual.slice(5)}`; prev = ind.series[kPrev]!=null?ind.series[kPrev]:null;
        refTag = MESES[+kAtual.slice(5)-1]+'/'+anoAtual.slice(2); notaRef=(ACUMS.includes(id)?'acum':'mês'); baseTxt='mesmo mês de '+anoAnt; }
    } else {
      const agg=arr=>{const v=arr.filter(x=>x!=null); if(!v.length)return null;
        return ind.unit==='rs'? v.reduce((a,b)=>a+b,0) : v.reduce((a,b)=>a+b,0)/v.length;};
      cur = agg(mesesCur.map(mm=>ind.series[`${anoAtual}-${mm}`]));
      prev= agg(mesesCur.map(mm=>ind.series[`${anoAnt}-${mm}`]));   // MESMO período do ano anterior
      if(mesesCur.length){ refTag = mesesCur.length===12? anoAtual
        : MESES[+mesesCur[0]-1]+'–'+MESES[+mesesCur[mesesCur.length-1]-1]+'/'+anoAtual.slice(2);
        baseTxt='mesmo período de '+anoAnt; }
    }
    /* com meta/limite -> compara com ela; sem meta -> compara com o ano anterior (mesmo período) */
    const comparaMeta = ind.target!=null;
    let alvo = comparaMeta ? ind.target : prev;
    let deltaTxt="—", seta="—";
    if(cur!=null&&alvo!=null&&alvo!==0){
      const suf = comparaMeta ? (ind.limite?' vs limite':' vs meta') : ' vs '+anoAnt;
      let dnum;
      if(ind.unit==='%'){ dnum=(cur-alvo)*100; deltaTxt=(dnum>=0?'+':'')+dnum.toFixed(1)+' p.p.'+suf; }
      else if(ind.unit==='d'){ dnum=cur-alvo; deltaTxt=(dnum>=0?'+':'')+dnum.toFixed(1)+' d'+suf; }
      else { dnum=(cur-alvo)/Math.abs(alvo)*100; deltaTxt=(dnum>=0?'+':'')+dnum.toFixed(1)+'%'+suf; }
      seta = dnum>0.001?'▲':dnum<-0.001?'▼':'—';
    }
    const s=status(ind,cur,prev);
    const cls = s==='ok'?'up':s==='warn'?'warnc':s==='bad'?'down':'flat';
    const palavra = s==='ok'?(comparaMeta?(ind.limite?'dentro do limite':'meta atingida'):(ind.dir==='up'?'acima do ano anterior':'abaixo do ano anterior'))
                  : s==='warn'?(comparaMeta?(ind.limite?'acima do limite':'atenção'):(ind.dir==='up'?'abaixo do ano anterior':'acima do ano anterior'))
                  : s==='bad'?'fora':'—';
    const metaLine = comparaMeta
      ? `<div class="hint" style="margin-top:5px">${ind.limite?'Limite':'Meta'} ${fmtMeta(ind)} · <b style="color:${STCOR[s]}">${palavra}</b>${parcialAviso}</div>`
      : `<div class="hint" style="margin-top:5px">${baseTxt? (notaRef==='acum'?'Acumulado do ano · ':'')+'<b style="color:'+STCOR[s]+'">'+palavra+'</b>'+parcialAviso :'Sem meta cadastrada'}</div>`;
    box.insertAdjacentHTML("beforeend",`
      <div class="kpi" style="--barc:${STCOR[s]!=='var(--ink-soft)'?STCOR[s]:(YEAR_COL[anoAtual]||'var(--genomma)')}">
        <div class="tag">${refTag}</div>
        <div class="lbl">${ind.label}</div>
        <div class="val">${fmtVal(ind,cur).replace(/(%| d| Mi| mil)$/,'<small>$1</small>')}</div>
        <span class="delta ${cls}">${seta} ${deltaTxt}</span>
        ${metaLine}
      </div>`);
  });
}

    const ind=DATA[id];
    const metaTag = ind.target!=null
      ? `<span class="metatag has"><i style="background:var(--ok)"></i>${ind.limite?'Limite':'Meta'} ${fmtMeta(ind)}</span>`
      : (ind.weekly? `<span class="metatag no"><i style="background:var(--ink-soft)"></i>unidades</span>`
        : ind.unit==='rs'
        ? `<span class="metatag no"><i style="background:var(--ink-soft)"></i>informacional</span>`

    g.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); desenhar(id);
  }));
  list.forEach(desenhar);
}
function subTexto(ind){
  if(ind.weekly) return 'Ano fechado compara o total; ano em curso compara até a mesma semana';
  if(ind.half) return 'Ajustes por semestre (H1/H2) · azul = positivo · vermelho = negativo';
  if(ind.limite) return `Limite máximo · não ultrapassar ${fmtMeta(ind)}`;
  if(ind.calc && ind.unit==='rs') return `Calculado · ${ind.calc}`;
  return ind.target!=null ? `Meta ${fmtMeta(ind)}` : (ind.unit==='rs'?'Valores em R$':'');
}

const baseOpts={chart:{fontFamily:"inherit",toolbar:{show:false},animations:{easing:"easeinout",speed:420},foreColor:"#5B6B78"},
  grid:{borderColor:"#EDF2F7",strokeDashArray:4},dataLabels:{enabled:false},

function eixoFmt(ind){
  if(ind.unit==='%')return v=>{const r=Math.round(v*10)/10;return (Number.isInteger(r)?r:r.toFixed(1))+'%';};
  if(ind.unit==='d')return v=>v.toFixed(0)+'d';
  if(ind.unit==='rs')return v=>fmtRS(v);
  return v=>Math.round(v).toLocaleString('pt-BR');

/* escala Y correta: % "maior é melhor"/alvo nunca passa de 100; % "menor é melhor" começa em 0 */
function yCfg(ind,vals){ const c={labels:{formatter:eixoFmt(ind)},forceNiceScale:true};
  if(ind.unit==='%'&&(ind.dir==='up'||ind.dir==='target')) c.max=100;
  if(ind.unit==='%'&&ind.dir==='down') c.min=0;
  if(ind.unit==='d'){
    const v=(vals||[]).filter(x=>x!=null&&!isNaN(x));
    if(v.length){
      const mn=Math.min(...v), mx=Math.max(...v);
      const lo=Math.max(0,Math.floor(mn)-1), amp=Math.max(1,Math.ceil(mx)+1-lo);
      const passo=Math.max(1,Math.ceil(amp/6));             // passo inteiro => rótulos únicos
      const ticks=Math.ceil(amp/passo);
      c.min=lo; c.max=lo+passo*ticks; c.tickAmount=ticks; c.forceNiceScale=false;
      c.labels={formatter:x=>Math.round(x)+' d'};
    }
  }
  return c;
}

        offsetY:-6},

      yaxis:[

         labels:{formatter:v=>(v>=0?'+':'')+v.toFixed(0)+'%'}},
        {opposite:true,seriesName:`Crescimento até a semana ${corte}`,show:false},
      ],

function desenhar(id){
  const ind=DATA[id], modo=modoDe(id), anoTopo=[...anosSel].sort().pop();
  if(ind.weekly) return desenharSemanal(id);
  if(ind.half) return desenharInv(id);
  if(id==='infull' && modo==='combo') return desenharInfull(id);

  if(modo==="gauge"){
    const cur=anualDe(ind,anoTopo);
    let fill; if(cur==null)fill=0;
    else if(ind.target==null) fill = ind.unit==='%'? Math.min(100,cur*100) : 100;
    else if(ind.dir==='up')   fill = ind.unit==='%'? Math.min(100,cur*100) : Math.min(100,ind.target/cur*100);
    else if(ind.dir==='down') fill = Math.min(100,ind.target/(cur||ind.target)*100);
    else                      fill = Math.min(100,cur/ind.target*100);
    const s=status(ind,cur);
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"radialBar",height:300},
      colors:[ind.target!=null?STCOR[s]:YEAR_COL[anoTopo]],
      plotOptions:{radialBar:{startAngle:-130,endAngle:130,hollow:{size:"62%"},track:{background:"#E8F2FB"},
        dataLabels:{name:{offsetY:24,fontSize:"12px",color:"#5B6B78",formatter:()=> ind.target!=null?((ind.limite?'Limite ':'Meta ')+fmtMeta(ind)):'sem meta'},
          value:{offsetY:-8,fontSize:"26px",fontWeight:700,color:"#12222F",formatter:()=>fmtVal(ind,cur)}}}},
      series:[+(+fill).toFixed(1)],labels:[String(anoTopo)]});
  }

  if(modo==="heat"){
    const yrs=[...anosSel].sort(); // ascendente: ApexCharts põe a última série (ano mais novo) na linha de cima
    const series=yrs.map(y=>({name:y,data:MESES.map((lab,i)=>({x:lab,y:scale(ind,ind.series[`${y}-${MMI[i]}`])}))}));
    let ranges;
    if(ind.target!=null){ const m=scale(ind,ind.target);
      if(ind.dir==='up')       ranges=[{from:-1e12,to:m*0.97,color:'#E4572E'},{from:m*0.97,to:m,color:'#E5A50A'},{from:m,to:1e12,color:'#1F9E6E'}];
      else if(ind.dir==='down')ranges=[{from:-1e12,to:m,color:'#1F9E6E'},{from:m,to:m*1.15,color:'#E5A50A'},{from:m*1.15,to:1e12,color:'#E4572E'}];
      else                     ranges=[{from:-1e12,to:m*0.94,color:'#E5A50A'},{from:m*0.94,to:m*1.06,color:'#1F9E6E'},{from:m*1.06,to:1e12,color:'#E5A50A'}];
    } else { // sem meta -> escala azul por valor
      const vals=series.flatMap(s=>s.data.map(d=>d.y)).filter(v=>v!=null);
      const mn=Math.min(...vals),mx=Math.max(...vals),st=(mx-mn)/5||1;
      const bl=["#DCEBF9","#A9CEEC","#6FAEDE","#2E7DC4","#155498"];
      ranges=bl.map((c,k)=>({from:k===0?mn-1:mn+st*k,to:k===4?mx+1:mn+st*(k+1),color:c}));
    }
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"heatmap",height:300},
      dataLabels:{enabled:true,style:{fontSize:'10px',fontWeight:700,colors:['#12222F']},
        formatter:v=>{ if(v==null||v===0&&ind.unit!=='%')return '';
          if(ind.unit==='%')return v.toFixed(1)+'%';
          if(ind.unit==='d')return v.toFixed(1);
          if(ind.unit==='rs')return fmtRS(v).replace('R$ ','');
          return Math.round(v).toLocaleString('pt-BR'); }},
      stroke:{width:2,colors:["#fff"]},
      plotOptions:{heatmap:{radius:4,enableShades:false,colorScale:{ranges}}},
      series,xaxis:{categories:MESES,axisBorder:{show:false},axisTicks:{show:false}},
      tooltip:{y:{formatter:v=>v==null?'—':fmtVal(ind,ind.unit==='%'?v/100:v)}}});
  }

  if(modo==="acum"){
    const r=RATIOS[id];
    if(r && DATA[r.num] && DATA[r.den]){   // razão: Σnum ÷ Σden (YTD)
      const num=DATA[r.num].series, den=DATA[r.den].series;
      const series=anosOrd().map(y=>{ let sn=0,sd=0; const arr=[];
        MMI.forEach(mm=>{ const k=`${y}-${mm}`;
          if(num[k]==null||den[k]==null){arr.push(null);return;}
          sn+=num[k]; sd+=den[k]; arr.push(sd? +((sn/sd)*100).toFixed(2) : null); });
        return {name:y,data:arr};
      });
      return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"line",height:300},
        colors:anosOrd().map(a=>YEAR_COL[a]),stroke:{curve:CURVA,width:3,lineCap:"round"},
        series,xaxis:{categories:MESES,axisBorder:{show:false},axisTicks:{show:false}},
        yaxis:yCfg(ind,series.flatMap(x=>x.data)),markers:{size:0,hover:{size:5}},annotations:metaAnn(ind),
        tooltip:{y:{formatter:v=>v==null?'—':v.toFixed(2)+'% (acum. no ano)'}}});
    }
    const tipo = (ind.unit==='rs') ? 'soma' : 'media';
    const series=anosOrd().map(y=>{ let s=0,n=0; const arr=[];
      MMI.forEach((mm,i)=>{ const v=ind.series[`${y}-${mm}`]; if(v==null){arr.push(null);return;}
        if(tipo==='soma'){s+=v;arr.push(scale(ind,s));} else {s+=v;n++;arr.push(scale(ind,s/n));} });
      return {name:y,data:arr};
    });
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"line",height:300},
      colors:anosOrd().map(a=>YEAR_COL[a]),stroke:{curve:CURVA,width:3,lineCap:"round"},
      series,xaxis:{categories:MESES,axisBorder:{show:false},axisTicks:{show:false}},
      yaxis:yCfg(ind,series.flatMap(x=>x.data)),markers:{size:0,hover:{size:5}}});
  }

  const tipo=modo==="bars"?"bar":modo==="area"?"area":"line";
  const series=anosOrd().map(y=>({name:y,data:MMI.map((mm,i)=>{const v=ind.series[`${y}-${mm}`];return v==null?null:+scale(ind,v).toFixed(ind.unit==='rs'?0:2);})}));
  mk(id,{...baseOpts,chart:{...baseOpts.chart,type:tipo,height:300},
    colors:anosOrd().map(a=>YEAR_COL[a]),
    stroke:{curve:CURVA,width:tipo==="bar"?0:3,lineCap:"round"},
    fill:tipo==="area"?{type:"gradient",gradient:{shadeIntensity:.3,opacityFrom:.32,opacityTo:.04}}:{opacity:1},
    plotOptions:{bar:{borderRadius:7,columnWidth:"55%",borderRadiusApplication:"end"}},
    series,xaxis:{categories:MESES,axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:yCfg(ind,series.flatMap(x=>x.data)),markers:{size:0,hover:{size:5}},
    annotations:metaAnn(ind),tooltip:{y:{formatter:v=>v==null?'—':fmtVal(ind,ind.unit==='%'?v/100:v)}}});
}

function toDisp(ind,v){ if(v==null||v==='')return ''; return ind.unit==='%'? +(v*100).toFixed(2) : +(+v).toFixed(ind.unit==='rs'?0:2); }
function fromDisp(ind,s){ if(s===''||s==null)return null; const n=+s; if(isNaN(n))return null; return ind.unit==='%'? +(n/100).toFixed(4) : n; }

function ehFormula(id){ const i=DATA[id]; return !!RATIOS[id] || id==='otif' || id==='infull' || !!(i&&i.calc) || !!(i&&i.half); }
function indsEdit(g){ return Object.keys(DATA).filter(k=>DATA[k].group===g && !ehFormula(k) && !SEM_EDICAO.includes(k)); }
async function abrirModal(prefId){
  if(!podeEditar()){ const ok=await autenticar(); if(!ok) return; }
  const sInd=document.getElementById("edInd"),sAno=document.getElementById("edAno"),sFrom=document.getElementById("edProjFrom");

    const ids=indsEdit(g);
    return ids.length? `<optgroup label="${g}">`+ids.map(id=>`<option value="${id}" ${id===prefId?'selected':''}>${DATA[id].label}</option>`).join("")+`</optgroup>` : '';
  }).join("");
  const ys=YEARS(); sAno.innerHTML=ys.map(a=>`<option ${a===ys[ys.length-1]?'selected':''}>${a}</option>`).join("");
  sFrom.innerHTML=MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join(""); sFrom.value=String(Math.max(0,new Date().getMonth()));
  montarTabela(); document.getElementById("overlay").classList.add("open");
}
function fecharModal(){document.getElementById("overlay").classList.remove("open");}
function montarTabela(){
  const id=document.getElementById("edInd").value, ano=document.getElementById("edAno").value, ind=DATA[id];
  if(!ind) return;
  // meta
  const mi=document.getElementById("edMeta"); mi.value = ind.target==null?'' : (ind.unit==='%'? +(ind.target*100).toFixed(2):ind.target);
  document.getElementById("edMetaUnit").textContent = ind.unit==='%'?'%':ind.unit==='d'?'dias':ind.unit==='rs'?'R$':ind.unit==='num'?'un':'';
  atualizaSig();
  if(ind.weekly){   // grade semanal: 53 semanas
    const head="<tr><th>Semana</th>"+SEMANAS.map(w=>`<th>S${w}</th>`).join("")+"</tr>";
    const row=`<tr><th style="text-align:left">Unidades</th>`+
      SEMANAS.map(w=>{const v=ind.series[`${ano}-${WK(w)}`];
        return `<td><input data-w="${w}" type="number" step="any" value="${v==null?'':v}"></td>`;}).join("")+"</tr>";
    document.getElementById("edTable").innerHTML=head+row;
    return;
  }
  // grid
  let head="<tr><th>Campo</th>"+MESES.map(m=>`<th>${m}</th>`).join("")+"</tr>";
  let row=`<tr><th style="text-align:left">${ind.label} (${ind.unit==='%'?'%':ind.unit})</th>`+
    MMI.map((mm,i)=>`<td><input data-m="${i}" type="number" step="any" value="${toDisp(ind,ind.series[`${ano}-${mm}`])}"></td>`).join("")+"</tr>";
  document.getElementById("edTable").innerHTML=head+row;
}
function atualizaSig(){
  const mi=document.getElementById("edMeta"), sig=document.getElementById("edMetaSig");
  const has = mi.value!=='' && !isNaN(+mi.value);
  sig.className="sig "+(has?"on":"off"); sig.innerHTML=`<i style="background:${has?'var(--ok)':'var(--ink-soft)'}"></i>${has?'meta ativa — linha no gráfico':'sem meta — nada no gráfico'}`;
}
function aplicarEditor(){
  const idEl=document.getElementById("edInd"), anoEl=document.getElementById("edAno");
  const id=idEl&&idEl.value, ano=anoEl&&anoEl.value, ind=id?DATA[id]:null;
  if(!ind||!ano) return null;   // modal não inicializado: nada a aplicar
  // meta
  const mv=document.getElementById("edMeta").value;
  ind.target = mv===''||isNaN(+mv) ? null : fromDisp(ind,mv);
  // série semanal
  if(ind.weekly){
    document.querySelectorAll("#edTable input[data-w]").forEach(inp=>{
      const key=`${ano}-${WK(+inp.dataset.w)}`;
      const v=inp.value===''?null:+inp.value;
      if(v==null||isNaN(v)) delete ind.series[key]; else ind.series[key]=v;
    });
    return id;
  }
  // série do ano
  document.querySelectorAll("#edTable input[data-m]").forEach(inp=>{
    const mm=MMI[+inp.dataset.m], key=`${ano}-${mm}`, v=fromDisp(ind,inp.value);
    if(v==null) delete ind.series[key]; else ind.series[key]=v;
  });
  // recalcula OTIF se mexeu em ontime/infull
  if(id==='ontime'||id==='fillrate') recomputeOtif();
  if(['ctw_rs','ctransp_rs','dev_rs','fat_rs'].includes(id)){ recomputeFatliq(); recomputeRatios(); recomputeCustoAcum(); }
  if(['ped_tot','ped_frac'].includes(id)) recomputeInfull();
  return id;
}
function preencherProjecao(){
  const idw=document.getElementById("edInd").value;
  if(DATA[idw]&&DATA[idw].weekly){          // projeção semanal: média das últimas 4 semanas preenchidas
    const ins=[...document.querySelectorAll("#edTable input[data-w]")];
    const vals=[]; let projetadas=0;
    ins.forEach(inp=>{ if(inp.value!==''){ vals.push(+inp.value); }
      else if(vals.length){ const k=Math.min(4,vals.length);
        const md=vals.slice(-k).reduce((a,b)=>a+b,0)/k;
        inp.value=Math.round(md); vals.push(md); projetadas++; } });
    toast(projetadas? projetadas+' semanas projetadas pela média das últimas 4' : 'Nada a projetar');
    return;
  }
  const from=+document.getElementById("edProjFrom").value, inputs=[...document.querySelectorAll("#edTable input[data-m]")];
  const vals=[];
  for(let m=0;m<12;m++){ const inp=inputs[m];
    if(m<from&&inp.value!==''){vals.push(+inp.value);}
    else if(m>=from){ const k=Math.min(3,vals.length); const md=k?vals.slice(-k).reduce((s,v)=>s+v,0)/k:(vals.at(-1)||0);
      const proj=+(md).toFixed(2); inp.value=proj; vals.push(proj); }
    else if(inp.value!=='')vals.push(+inp.value);
  }
  toast("Projeção preenchida a partir de "+MESES[from]);
}
function exportar(){
  aplicarEditor();
  const blob=new Blob([JSON.stringify(DATA,null,0)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="dados.json"; a.click();
  toast("dados.json exportado — suba no GitHub para publicar.");
}
/* grava o JSON no Storage: tenta upload(upsert) e, se o objeto já existir, usa update() */
async function gravarStorage(){
  const blob=new Blob([JSON.stringify(DATA)],{type:'application/json'});
  const opt={upsert:true,contentType:'application/json',cacheControl:'0'};
  let {error}=await sb.storage.from(BUCKET).upload(STORE_PATH,blob,opt);
  if(error){
    const m=(error.message||'')+' '+(error.statusCode||'');
    if(/exist|duplicate|409|400/i.test(m)){                    // objeto já existe -> update
      const r2=await sb.storage.from(BUCKET).update(STORE_PATH,blob,opt);
      if(!r2.error) return {ok:true,via:'update'};
      error=r2.error;
    }
    return {ok:false,error};
  }
  return {ok:true,via:'upload'};
}
function explicaErro(e){
  const m=(e&&e.message)||String(e), code=(e&&(e.statusCode||e.status))||'';
  if(/row-level security|violates|policy/i.test(m))
    return 'Sem permissão de escrita no bucket (política RLS). Ajuste a policy do bucket "'+BUCKET+'" no painel do Supabase para permitir INSERT/UPDATE ao usuário autenticado.';
  if(/jwt|token|expired|invalid/i.test(m)) return 'Sessão expirada — clique novamente para entrar.';
  if(/not found|404/i.test(m+code)) return 'Bucket "'+BUCKET+'" ou caminho não encontrado no Supabase.';
  if(/401|403|unauthorized|forbidden/i.test(m+code)) return 'Não autorizado — é preciso estar logado como '+ADMIN_EMAIL+'.';
  return m+(code?' (código '+code+')':'');
}
async function salvarServidor(){
  if(!podeEditar()){ toast('Somente '+ADMIN_EMAIL+' pode salvar dados.'); return; }
  aplicarEditor(); render();
  const st=document.getElementById("edStatus");
  if(!sb){ st.textContent="SDK do Supabase não carregou — use Exportar dados.json."; toast("Sem conexão — use Exportar"); return; }
  st.textContent="Salvando…";
  try{
    const r=await gravarStorage();
    if(!r.ok) throw r.error;
    st.textContent="✓ Salvo no servidor ("+r.via+") às "+new Date().toLocaleTimeString('pt-BR');
    toast("Salvo no Supabase ✓"); fecharModal();
  }catch(e){
    st.textContent="Não salvou: "+explicaErro(e);
    toast("Falha ao salvar — veja a mensagem e use Exportar");
  }
}
/* diagnóstico: mostra exatamente em que etapa está o problema */
async function diagnosticar(){
  const st=document.getElementById("edStatus"); const L=[];
  L.push(sb?'SDK carregado: OK':'SDK carregado: FALHOU');
  if(sb){
    try{ const {data:{session}}=await sb.auth.getSession();
      L.push(session? ('Sessão: '+session.user.email) : 'Sessão: NENHUMA (precisa entrar)');
    }catch(e){ L.push('Sessão: erro '+e.message); }
    try{ const {error}=await sb.storage.from(BUCKET).download(STORE_PATH);
      L.push(error? ('Leitura do arquivo: FALHOU — '+explicaErro(error)) : 'Leitura do arquivo: OK');
    }catch(e){ L.push('Leitura: erro '+e.message); }
    L.push(podeEditar()? 'Permissão de edição: OK ('+ADMIN_EMAIL+')' : 'Permissão de edição: NÃO (somente leitura)');
  }
  st.innerHTML=L.join(' · ');
  console.log('[Diagnóstico Supabase]\n'+L.join('\n'));
  toast('Diagnóstico concluído — veja a mensagem');
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---- carga real (override do embutido) ---- */
/* Mescla o que está salvo no servidor com a base do repositório.
   Regra: valores salvos pelo usuário prevalecem, MAS indicadores novos
   publicados no repositório (ex.: um KPI recém-criado) não somem, e
   propriedades novas (weekly, limite, calc...) são preservadas. */
function mesclarDados(base, salvo){
  if(!salvo || typeof salvo!=='object') return base;
  const out=JSON.parse(JSON.stringify(base||{}));
  Object.keys(salvo).forEach(k=>{
    out[k] = (out[k] && typeof out[k]==='object')
      ? Object.assign({}, out[k], salvo[k])   // repo preenche o que faltar
      : salvo[k];
  });
  return out;
}
async function carregar(){
  let base=null;
  if(API_BASE){try{const r=await fetch(API_BASE+"/api/dados");if(r.ok)base=await r.json();}catch(e){}}
  if(!base){try{const r=await fetch("./dados.json?v="+Date.now(),{cache:"no-store"});if(r.ok)base=await r.json();}catch(e){}}
  if(base && typeof base==='object' && Object.keys(base).length){ DATA=base; }
  /* o que foi salvo no servidor prevalece nos valores, sem apagar novidades */
  if(sb){
    try{
      const {data,error}=await sb.storage.from(BUCKET).download(STORE_PATH);
      if(!error && data){
        const salvo=JSON.parse(await data.text());
        if(salvo && typeof salvo==='object' && Object.keys(salvo).length) DATA=mesclarDados(DATA,salvo);
      }
    }catch(e){}
  }
  if(!DATA.inventario) DATA.inventario=JSON.parse(JSON.stringify(INV_EMBED.inventario));
  Object.entries(PED_EMBED).forEach(([k,v])=>{ if(!DATA[k]) DATA[k]=JSON.parse(JSON.stringify(v)); });
  recomputeOtif(); recomputeInfull(); recomputeFatliq(); recomputeRatios(); recomputeCustoAcum();
}

document.getElementById("btnClose").onclick=fecharModal;
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")fecharModal();};
document.getElementById("edInd").onchange=montarTabela;
document.getElementById("edAno").onchange=montarTabela;
document.getElementById("edMeta").oninput=atualizaSig;
document.getElementById("btnFillProj").onclick=preencherProjecao;
document.getElementById("btnDiag").onclick=diagnosticar;
document.getElementById("btnPreview").onclick=()=>{aplicarEditor();render();toast("Preview aplicado (não salvo)");};
document.getElementById("btnExport").onclick=exportar;
document.getElementById("btnSave").onclick=salvarServidor;
document.getElementById("btnProj").onclick=()=>{abrirModal();setTimeout(preencherProjecao,60);};

(async function(){ await initAuth(); await carregar(); render(); marcaAdmin(); })();
