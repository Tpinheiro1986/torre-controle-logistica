<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecard Logístico — Torre de Controle</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<style>
  :root{
    --genomma-900:#0B2A55; --genomma-700:#134E86; --genomma:#185FA5;
    --genomma-500:#1E6FC0; --genomma-400:#37A0D8; --genomma-300:#7CC6E8;
    --genomma-200:#C7E0F4; --genomma-100:#E8F2FB;
    --ink:#12222F; --ink-soft:#5B6B78; --line:#E3EAF0; --bg:#F5F8FB; --card:#FFF;
    --alert:#E4572E; --warn:#E5A50A; --ok:#1F9E6E;
    --radius:16px; --shadow:0 1px 2px rgba(16,45,70,.04), 0 8px 24px rgba(16,45,70,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}

  /* Topbar */
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;
    background:linear-gradient(100deg,var(--genomma-900),var(--genomma) 72%);
    color:#fff;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center}
  .brand small{display:block;font-weight:500;opacity:.78;font-size:11px;letter-spacing:.3px}
  .topbar .spacer{flex:1}
  .btn{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff} .btn-ghost:hover{background:rgba(255,255,255,.24)}
  .btn-primary{background:#fff;color:var(--genomma-900)} .btn-primary:hover{background:var(--genomma-100)}

  /* Tabs de dimensão */
  .tabs{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);
    padding:0 22px;position:sticky;top:58px;z-index:30}
  .tab{display:flex;align-items:center;gap:8px;padding:14px 16px;border:0;background:transparent;
    color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
  .tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .tab:hover{color:var(--genomma)}
  .tab.active{color:var(--genomma);border-bottom-color:var(--genomma)}

  .wrap{max-width:1400px;margin:0 auto;padding:20px 22px}
  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .filters label{color:var(--ink-soft);font-size:12px}
  .dim-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .dim-head h2{margin:0;font-size:18px;letter-spacing:-.3px}
  .dim-head span{color:var(--ink-soft);font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;
    cursor:pointer;color:var(--ink-soft);transition:.15s;user-select:none;display:flex;align-items:center;gap:6px}
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip.on{background:var(--genomma);border-color:var(--genomma);color:#fff}
  select,input[type=number]{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:.15s}
  .kpi:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,45,70,.08),0 12px 30px rgba(16,45,70,.08)}
  .kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--barc,var(--genomma))}
  .kpi.sel{outline:2px solid var(--genomma);outline-offset:-2px}
  .kpi .lbl{color:var(--ink-soft);font-size:12px;font-weight:600}
  .kpi .val{font-size:26px;font-weight:750;margin:6px 0 2px;letter-spacing:-.5px}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .kpi .delta{font-size:11px;font-weight:600}
  .up{color:var(--ok)} .down{color:var(--alert)} .flat{color:var(--ink-soft)}
  .kpi .tag{position:absolute;top:12px;right:14px;font-size:10px;color:var(--ink-soft);background:var(--genomma-100);border-radius:20px;padding:2px 7px}

  /* Panels */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .panel .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
  .panel h3{margin:0;font-size:14px} .panel .sub{margin:2px 0 0;color:var(--ink-soft);font-size:12px}
  .modes{display:flex;gap:3px;background:var(--genomma-100);border-radius:9px;padding:3px}
  .modes button{border:0;background:transparent;color:var(--genomma-700);font-family:inherit;font-size:11px;font-weight:600;
    padding:5px 9px;border-radius:7px;cursor:pointer;transition:.12s}
  .modes button.on{background:#fff;color:var(--genomma);box-shadow:0 1px 2px rgba(16,45,70,.12)}
  .about{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .about summary{cursor:pointer;color:var(--genomma);font-size:12px;font-weight:600;list-style:none}
  .about summary::-webkit-details-marker{display:none}
  .about summary::before{content:"▸ ";font-size:10px}
  .about[open] summary::before{content:"▾ "}
  .about p{margin:6px 0 0;color:var(--ink-soft);font-size:12px;line-height:1.5}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(11,42,85,.4);display:none;align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(2px)}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:18px;width:min(960px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(11,42,85,.3)}
  .modal header{position:sticky;top:0;background:#fff;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal header h2{margin:0;font-size:16px}
  .modal .body{padding:18px 22px}
  .modal footer{position:sticky;bottom:0;background:#fff;padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .gridform{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .gridform .f{display:flex;flex-direction:column;gap:4px}
  .gridform .f label{font-size:11px;color:var(--ink-soft);font-weight:600}
  .month-table{width:100%;border-collapse:collapse;margin-top:6px}
  .month-table th,.month-table td{border:1px solid var(--line);padding:5px;text-align:center;font-size:12px}
  .month-table th{background:var(--genomma-100);color:var(--genomma-900)}
  .month-table input{width:76px;border:1px solid var(--line);border-radius:6px;padding:4px;text-align:right}
  .hint{font-size:11px;color:var(--ink-soft)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--genomma-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1}

  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.gridform{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot">◧</span><div>Scorecard Logístico<small>Torre de Controle · Genomma Lab</small></div></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="btnProj">Projetar ▸</button>
  <button class="btn btn-primary" id="btnEdit">Lançar / editar dados</button>
</div>

<nav class="tabs" id="tabs"></nav>

<div class="wrap">
  <div class="filters">
    <div class="dim-head"><h2 id="dimNome">—</h2><span id="dimSub"></span></div>
    <span style="flex:1"></span>
    <label>Anos:</label><div class="chips" id="yearChips"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" id="panels"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <header><h2>Lançar / editar dados</h2>
      <button class="btn btn-primary" id="btnClose">Fechar ✕</button></header>
    <div class="body">
      <div class="gridform">
        <div class="f"><label>Ano</label><select id="edAno"></select></div>
        <div class="f"><label>Indicador</label><select id="edInd"></select></div>
        <div class="f"><label>Projetar a partir de</label><select id="edProjFrom"></select></div>
        <div class="f" style="justify-content:flex-end"><button class="btn btn-primary" style="background:var(--genomma);color:#fff" id="btnFillProj">Preencher projeção</button></div>
      </div>
      <p class="hint">Campos a partir do mês escolhido são preenchidos por média móvel dos meses anteriores. "Pré-visualizar" atualiza os gráficos sem salvar.</p>
      <div style="overflow:auto"><table class="month-table" id="edTable"></table></div>
    </div>
    <footer><span class="hint" id="edStatus">—</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" style="background:var(--genomma-100);color:var(--genomma-900)" id="btnPreview">Pré-visualizar</button>
        <button class="btn btn-primary" style="background:var(--genomma);color:#fff" id="btnSave">Salvar</button>
      </div>
    </footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Scorecard Logístico — Torre de Controle
   Design unificado (azul Genomma, curvas suaves), 6 abas,
   6 modos de visualização por indicador.
   OTIF e In Full com cálculo corrigido.
   ============================================================ */
const API_BASE = "";
const FONTE_DADOS = "./dados.json"; // dados publicados no repo — LIDO, nunca sobrescrito pela página
const MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const ANOS  = [2021,2022,2023,2024,2025,2026];
const CORES_ANO = {2021:"#7CC6E8",2022:"#37A0D8",2023:"#1E6FC0",2024:"#185FA5",2025:"#2A3F8F",2026:"#0B2A55"};
const CURVA = "smooth";

/* ---------- ícones das abas ---------- */
const IC = {
  entregas:'<path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>',
  custo:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 9.5c0-1 1-1.6 2.5-1.6s2.5.7 2.5 1.7-1 1.4-2.5 1.4-2.5.5-2.5 1.5 1 1.6 2.5 1.6 2.5-.6 2.5-1.6"/>',
  qualidade:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  estoque:'<path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/>',
  prazos:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  pessoas:'<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><path d="M16 6a3 3 0 010 6M21 19c0-2.2-1.5-4-3.5-4.6"/>',
};

/* ---------- base de dados simulada (determinística) ---------- */
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function lerp(a,b,t){return a+(b-a)*t;}
function gerarBase(){
  const D={};
  ANOS.forEach((ano,ai)=>{
    const r=rng(ano*7+3), t=ai/5;                 // t: 0 (2021) -> 1 (2026)
    D[ano]=MESES.map((_,m)=>{
      const saz=1+0.05*Math.sin((m/12)*Math.PI*2), j=(r()-.5);
      const totalPed=Math.round(lerp(1900,2600,t)*saz+j*250);
      const frac=Math.round(totalPed*Math.max(.04,lerp(.16,.055,t)+j*.02));
      const otif=Math.round(totalPed*Math.min(.995,lerp(.865,.972,t)+j*.02));
      const itensPed=totalPed*4+Math.round(r()*200);
      const itensEnt=Math.round(itensPed*Math.min(.998,lerp(.905,.985,t)+j*.015));
      const previsto=totalPed, real=Math.round(totalPed*(1+j*.11));
      const faturamento=Math.round(lerp(8.2e6,14.5e6,t)*saz+j*6e5);
      const custoTransp=Math.round(faturamento*lerp(.062,.046,t)+j*4e4);
      const custoWh=Math.round(faturamento*lerp(.036,.028,t)+j*3e4);
      const devolucao=Math.round(faturamento*Math.max(.012,lerp(.031,.017,t)+j*.004));
      return {totalPed,frac,otif,itensPed,itensEnt,previsto,real,
        faturamento,custoTransp,custoWh,devolucao,
        acuraInv:+lerp(94,99,t).toFixed(1)+j*1.2,
        coberturaDias:+lerp(45,29,t).toFixed(1)+j*3,
        ruptura:Math.max(.5,+lerp(5,1.6,t).toFixed(1)+j*.6),
        avarias:Math.max(.15,+lerp(1.2,.4,t).toFixed(2)+j*.15),
        divergencias:Math.max(.4,+lerp(3,1,t).toFixed(1)+j*.4),
        reclamacoes:Math.max(6,Math.round(lerp(40,13,t)+j*8)),
        leadTotal:+lerp(9,5,t).toFixed(1)+j*.8,
        prazoEntrega:+lerp(6,3.4,t).toFixed(1)+j*.6,
        cicloPedido:+lerp(4,2.4,t).toFixed(1)+j*.4,
        noPrazoPct:Math.min(99,+lerp(90,97,t).toFixed(1)+j*1.5),
        produtividade:+lerp(18,28,t).toFixed(1)+j*1.5,
        absenteismo:Math.max(1.5,+lerp(6,3,t).toFixed(1)+j*.7),
        turnover:Math.max(1,+lerp(4.2,2,t).toFixed(1)+j*.5),
        headcount:Math.round(lerp(120,150,t)+j*6),
      };
    });
  });
  return D;
}
let BASE=gerarBase();

/* ---------- definição dos indicadores ----------
   value(d): valor mensal | unit | meta | higher(better) | money | acumTipo
*/
const IND={
  otif:{nome:"OTIF",unit:"%",meta:95,higher:true,value:d=>d.otif/d.totalPed*100,combo:true,
    campos:["totalPed","otif"],sobre:"On Time In Full: pedidos entregues no prazo E completos dividido pelo total de pedidos. Por definição fica ≤ 100%."},
  infull:{nome:"In Full",unit:"%",meta:92,higher:true,value:d=>(d.totalPed-d.frac)/d.totalPed*100,combo:true,
    campos:["totalPed","frac"],sobre:"(Total de pedidos − fracionados) / total. As barras mostram o volume de pedidos por trás do percentual, dando dimensão."},
  fill:{nome:"Fill Rate",unit:"%",meta:98,higher:true,value:d=>d.itensEnt/d.itensPed*100,
    campos:["itensPed","itensEnt"],sobre:"Itens entregues sobre itens pedidos. Mede completude no nível de item."},
  noPrazo:{nome:"Entregas no prazo",unit:"%",meta:96,higher:true,value:d=>d.noPrazoPct,
    campos:["noPrazoPct"],sobre:"Percentual de entregas dentro do prazo acordado."},
  faturamento:{nome:"Faturamento",unit:"R$",higher:true,money:true,acum:"soma",value:d=>d.faturamento,
    campos:["faturamento"],sobre:"Receita bruta do período. Indicador informacional (não entra no health score)."},
  custoTransp:{nome:"Custo de Transporte",unit:"R$",higher:false,money:true,acum:"soma",value:d=>d.custoTransp,
    campos:["custoTransp"],sobre:"Custo de frete/transporte no período. Informacional."},
  custoTW:{nome:"Custo Total T&W",unit:"R$",higher:false,money:true,acum:"soma",value:d=>d.custoTransp+d.custoWh,
    campos:["custoTransp","custoWh"],sobre:"Transporte + Armazenagem (Warehouse). Informacional."},
  devolucao:{nome:"Devolução",unit:"R$",higher:false,money:true,acum:"soma",value:d=>d.devolucao,
    campos:["devolucao"],sobre:"Valor devolvido no período (lançamento manual). Informacional."},
  fatLiquido:{nome:"Faturamento Líquido",unit:"R$",higher:true,money:true,acum:"soma",value:d=>d.faturamento-d.devolucao,
    campos:["faturamento","devolucao"],sobre:"Faturamento − Devolução (auto-calculado)."},
  pctDevol:{nome:"% Devolução",unit:"%",meta:2,higher:false,value:d=>d.devolucao/d.faturamento*100,acum:"media",
    campos:["faturamento","devolucao"],sobre:"Devolução / Faturamento (auto). Quanto menor, melhor."},
  pctTW:{nome:"% T&W s/ Faturamento",unit:"%",meta:8,higher:false,value:d=>(d.custoTransp+d.custoWh)/d.faturamento*100,acum:"media",
    campos:["faturamento","custoTransp","custoWh"],sobre:"Custo Total T&W / Faturamento (auto). Modo Acumulado mostra o YTD."},
  avarias:{nome:"Avarias",unit:"%",meta:.5,higher:false,value:d=>d.avarias,
    campos:["avarias"],sobre:"Percentual de itens/pedidos com avaria."},
  divergencias:{nome:"Divergências",unit:"%",meta:1.5,higher:false,value:d=>d.divergencias,
    campos:["divergencias"],sobre:"Divergências de conferência sobre o total."},
  reclamacoes:{nome:"Reclamações",unit:"num",meta:15,higher:false,value:d=>d.reclamacoes,
    campos:["reclamacoes"],sobre:"Volume de reclamações registradas no mês."},
  acuraInv:{nome:"Acuracidade de Estoque",unit:"%",meta:98,higher:true,value:d=>d.acuraInv,
    campos:["acuraInv"],sobre:"Aderência entre estoque físico e sistêmico."},
  forecast:{nome:"Acuracidade de Previsão",unit:"%",meta:90,higher:true,value:d=>100-Math.abs(d.real-d.previsto)/d.real*100,
    campos:["real","previsto"],sobre:"100% − MAPE. Aderência da demanda real ao previsto."},
  cobertura:{nome:"Cobertura de Estoque",unit:"dias",meta:30,higher:false,value:d=>d.coberturaDias,
    campos:["coberturaDias"],sobre:"Dias de estoque disponíveis à taxa de consumo atual."},
  ruptura:{nome:"Ruptura",unit:"%",meta:2,higher:false,value:d=>d.ruptura,
    campos:["ruptura"],sobre:"Percentual de itens em falta (stockout)."},
  leadTotal:{nome:"Lead Time Total",unit:"dias",meta:6,higher:false,value:d=>d.leadTotal,
    campos:["leadTotal"],sobre:"Tempo total do ciclo, do pedido à entrega."},
  prazoEntrega:{nome:"Prazo de Entrega",unit:"dias",meta:4,higher:false,value:d=>d.prazoEntrega,
    campos:["prazoEntrega"],sobre:"Tempo médio de trânsito até o cliente."},
  cicloPedido:{nome:"Ciclo do Pedido",unit:"dias",meta:3,higher:false,value:d=>d.cicloPedido,
    campos:["cicloPedido"],sobre:"Do recebimento do pedido à expedição."},
  produtividade:{nome:"Produtividade OPL",unit:"num",meta:25,higher:true,value:d=>d.produtividade,
    campos:["produtividade"],sobre:"Pedidos processados por hora-homem."},
  absenteismo:{nome:"Absenteísmo",unit:"%",meta:3,higher:false,value:d=>d.absenteismo,
    campos:["absenteismo"],sobre:"Percentual de ausências sobre a jornada prevista."},
  turnover:{nome:"Turnover",unit:"%",meta:2.5,higher:false,value:d=>d.turnover,
    campos:["turnover"],sobre:"Rotatividade de pessoal no período."},
  headcount:{nome:"Headcount OPL",unit:"num",higher:true,value:d=>d.headcount,acum:false,
    campos:["headcount"],sobre:"Quadro de pessoas na operação logística. Informacional."},
};

/* ---------- dimensões (abas) ---------- */
const DIMS=[
  {id:"entregas",nome:"Entregas & Atendimento",sub:"Nível de serviço de entregas e atendimento a pedidos",inds:["otif","infull","fill","noPrazo"]},
  {id:"custo",nome:"Custo Logístico",sub:"Indicadores financeiros em R$ (informacionais)",inds:["faturamento","custoTransp","custoTW","devolucao","fatLiquido","pctDevol","pctTW"]},
  {id:"qualidade",nome:"Qualidade & Devolução",sub:"Devoluções, avarias e conformidade",inds:["pctDevol","avarias","divergencias","reclamacoes"]},
  {id:"estoque",nome:"Estoque & Acuracidade",sub:"Acuracidade de inventário e de previsão",inds:["acuraInv","forecast","cobertura","ruptura"]},
  {id:"prazos",nome:"Prazos & Lead Time",sub:"Tempos de ciclo e cumprimento de prazos",inds:["leadTotal","prazoEntrega","cicloPedido","noPrazo"]},
  {id:"pessoas",nome:"Pessoas OPL",sub:"Produtividade e indicadores de equipe",inds:["produtividade","absenteismo","turnover","headcount"]},
];
const MODOS=[["linhas","Linhas"],["barras","Barras"],["area","Área"],["heatmap","Heatmap"],["medidor","Medidor"],["acumulado","Acumulado"]];

/* ---------- estado ---------- */
let dimAtiva="entregas";
let anosSel=JSON.parse(localStorage.getItem("sc-anos")||"null")||[2024,2025,2026];
let modoPorInd=JSON.parse(localStorage.getItem("sc-modos")||"{}");
const charts={};
function salvarPrefs(){localStorage.setItem("sc-anos",JSON.stringify(anosSel));localStorage.setItem("sc-modos",JSON.stringify(modoPorInd));}
function modoDe(id){return modoPorInd[id]||"linhas";}

/* ---------- utilidades de formatação ---------- */
function ultimoMes(ano){return ano===2026?new Date().getMonth():11;}
function fmt(ind,v){
  if(ind.money) return "R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" M";
  if(ind.unit==="%") return v.toFixed(1)+"%";
  if(ind.unit==="dias") return v.toFixed(1)+" d";
  return Math.round(v).toLocaleString("pt-BR");
}
function serie(ano,ind,ate){const n=(ate??ultimoMes(ano))+1;return BASE[ano].slice(0,n).map(ind.value);}
function media(ano,ind){const s=serie(ano,ind);return s.reduce((a,b)=>a+b,0)/s.length;}
function acumular(vals,tipo){const out=[];let s=0;vals.forEach((v,i)=>{s+=v;out.push(tipo==="media"?s/(i+1):s);});return out;}

/* ============================================================
   Render
   ============================================================ */
function renderTabs(){
  const el=document.getElementById("tabs");el.innerHTML="";
  DIMS.forEach(d=>{
    const b=document.createElement("button");
    b.className="tab"+(d.id===dimAtiva?" active":"");
    b.innerHTML=`<svg viewBox="0 0 24 24">${IC[d.id]}</svg>${d.nome}`;
    b.onclick=()=>{dimAtiva=d.id;renderTabs();renderDim();};
    el.appendChild(b);
  });
}
function renderChips(){
  const box=document.getElementById("yearChips");box.innerHTML="";
  ANOS.forEach(a=>{
    const c=document.createElement("div");c.className="chip"+(anosSel.includes(a)?" on":"");
    c.innerHTML=`<span class="sw" style="background:${CORES_ANO[a]}"></span>${a}`;
    c.onclick=()=>{if(anosSel.includes(a)){if(anosSel.length>1)anosSel=anosSel.filter(x=>x!==a);}else anosSel=[...anosSel,a].sort();
      salvarPrefs();renderChips();renderDim();};
    box.appendChild(c);
  });
}
function renderDim(){
  const dim=DIMS.find(d=>d.id===dimAtiva);
  document.getElementById("dimNome").textContent=dim.nome;
  document.getElementById("dimSub").textContent=dim.sub;
  Object.values(charts).forEach(c=>c.destroy());for(const k in charts)delete charts[k];
  renderKpis(dim);renderPanels(dim);
}
function renderKpis(dim){
  const box=document.getElementById("kpis");box.innerHTML="";
  const anoAtual=Math.max(...anosSel),anoAnt=anoAtual-1;
  dim.inds.forEach(id=>{
    const ind=IND[id],cur=media(anoAtual,ind),prev=BASE[anoAnt]?media(anoAnt,ind):null;
    let deltaTxt="—",dir="flat";
    if(prev!=null){
      if(ind.money||ind.unit==="num"||ind.unit==="dias"){const pc=(cur-prev)/prev*100;dir=pc>0.3?(ind.higher?"up":"down"):pc<-0.3?(ind.higher?"down":"up"):"flat";deltaTxt=(pc>=0?"+":"")+pc.toFixed(1)+"% YoY";}
      else{const d=cur-prev;dir=d>0.05?(ind.higher?"up":"down"):d<-0.05?(ind.higher?"down":"up"):"flat";deltaTxt=(d>=0?"+":"")+d.toFixed(1)+" p.p. YoY";}
    }
    let metaTxt="";
    if(ind.meta!=null){const ok=ind.higher?cur>=ind.meta:cur<=ind.meta;
      metaTxt=`<div class="hint" style="margin-top:5px">Meta ${ind.unit==="%"?ind.meta+"%":ind.meta} · <b style="color:${ok?'var(--ok)':'var(--alert)'}">${ok?"ok":"atenção"}</b></div>`;}
    else if(ind.money) metaTxt=`<div class="hint" style="margin-top:5px">Informacional</div>`;
    const barc=CORES_ANO[anoAtual];
    box.insertAdjacentHTML("beforeend",`
      <div class="kpi ${id===(window._selInd||dim.inds[0])?'sel':''}" data-ind="${id}" style="--barc:${barc}">
        <div class="tag">${anoAtual}</div>
        <div class="lbl">${ind.nome}</div>
        <div class="val">${fmt(ind,cur).replace(/(%| d| M)$/,'<small>$1</small>')}</div>
        <span class="delta ${dir}">${dir==="up"?"▲":dir==="down"?"▼":"—"} ${deltaTxt}</span>
        ${metaTxt}
      </div>`);
  });
  box.querySelectorAll(".kpi").forEach(k=>k.onclick=()=>{
    window._selInd=k.dataset.ind;box.querySelectorAll(".kpi").forEach(x=>x.classList.remove("sel"));k.classList.add("sel");
    document.getElementById("p_"+k.dataset.ind)?.scrollIntoView({behavior:"smooth",block:"center"});
  });
}
function renderPanels(dim){
  const box=document.getElementById("panels");box.innerHTML="";
  dim.inds.forEach(id=>{
    const ind=IND[id];
    box.insertAdjacentHTML("beforeend",`
      <div class="panel" id="p_${id}">
        <div class="head">
          <div><h3>${ind.nome}</h3><p class="sub">${subTexto(ind)}</p></div>
          <div class="modes" data-ind="${id}">${MODOS.map(([m,l])=>`<button data-m="${m}" class="${modoDe(id)===m?'on':''}">${l}</button>`).join("")}</div>
        </div>
        <div id="ch_${id}" style="height:300px"></div>
        <details class="about"><summary>Sobre o indicador</summary><p>${ind.sobre}</p></details>
      </div>`);
  });
  box.querySelectorAll(".modes").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const id=g.dataset.ind;modoPorInd[id]=b.dataset.m;salvarPrefs();
    g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    desenhar(id);
  }));
  dim.inds.forEach(desenhar);
}
function subTexto(ind){
  if(ind.money) return "Valores em R$ · variação YoY";
  if(ind.meta!=null) return (ind.higher?"Maior é melhor":"Menor é melhor")+" · meta "+(ind.unit==="%"?ind.meta+"%":ind.unit==="dias"?ind.meta+" d":ind.meta);
  return "Indicador informacional";
}

/* ---------- opções base ApexCharts ---------- */
const baseOpts={
  chart:{fontFamily:"inherit",toolbar:{show:false},animations:{easing:"easeinout",speed:450},foreColor:"#5B6B78"},
  grid:{borderColor:"#EDF2F7",strokeDashArray:4},dataLabels:{enabled:false},
  legend:{position:"top",horizontalAlign:"left",fontSize:"12px",markers:{radius:6}},tooltip:{theme:"light"},
};
function fmtEixo(ind){
  if(ind.money) return v=>"R$ "+(v/1e6).toFixed(1)+"M";
  if(ind.unit==="%") return v=>v.toFixed(0)+"%";
  if(ind.unit==="dias") return v=>v.toFixed(0)+"d";
  return v=>Math.round(v).toLocaleString("pt-BR");
}
function mk(id,opts){const sel="#ch_"+id;if(charts[id]){charts[id].updateOptions(opts,true,true);return;}charts[id]=new ApexCharts(document.querySelector(sel),opts);charts[id].render();}

/* ---------- desenhar um indicador conforme o modo ---------- */
function desenhar(id){
  const ind=IND[id],modo=modoDe(id),anoTopo=Math.max(...anosSel);
  const metaAnn=ind.meta!=null?{yaxis:[{y:ind.meta,borderColor:"#E4572E",strokeDashArray:5,
      label:{text:"Meta "+(ind.unit==="%"?ind.meta+"%":ind.meta),style:{background:"#E4572E",color:"#fff",fontSize:"10px"}}}]}:{};

  // In Full em modo Barras => combo volume + %
  if(id==="infull" && modo==="barras"){
    const n=ultimoMes(anoTopo)+1,arr=BASE[anoTopo].slice(0,n);
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"line",height:300,stacked:true},
      colors:["#185FA5","#C7E0F4","#0B2A55"],stroke:{curve:CURVA,width:[0,0,3],lineCap:"round"},
      plotOptions:{bar:{borderRadius:7,columnWidth:"58%",borderRadiusApplication:"end"}},
      series:[{name:"Completos",type:"column",data:arr.map(d=>d.totalPed-d.frac)},
              {name:"Fracionados",type:"column",data:arr.map(d=>d.frac)},
              {name:"% In Full",type:"line",data:arr.map(d=>+ind.value(d).toFixed(1))}],
      xaxis:{categories:MESES.slice(0,n),axisBorder:{show:false},axisTicks:{show:false}},
      yaxis:[{title:{text:"Volume"},labels:{formatter:v=>Math.round(v).toLocaleString("pt-BR")}},
             {show:false},{opposite:true,min:0,max:100,title:{text:"% In Full"},labels:{formatter:v=>v.toFixed(0)+"%"}}],
      markers:{size:0},tooltip:{shared:true,intersect:false,
        y:{formatter:(v,{seriesIndex})=>seriesIndex===2?v.toFixed(1)+"%":Math.round(v).toLocaleString("pt-BR")+" ped."}},
      annotations:{yaxis:[{y:ind.meta,yAxisIndex:2,borderColor:"#E4572E",strokeDashArray:5,
        label:{text:"Meta "+ind.meta+"%",style:{background:"#E4572E",color:"#fff",fontSize:"10px"}}}]}});
  }

  if(modo==="medidor"){
    const cur=media(anoTopo,ind);
    let score = ind.meta!=null ? (ind.higher?cur/ind.meta:ind.meta/cur)*100 : cur;
    score=Math.max(0,Math.min(150,score));
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"radialBar",height:300},
      colors:[CORES_ANO[anoTopo]],
      plotOptions:{radialBar:{startAngle:-135,endAngle:135,hollow:{size:"62%"},
        track:{background:"#E8F2FB"},
        dataLabels:{name:{offsetY:22,color:"#5B6B78",fontSize:"12px"},
          value:{offsetY:-8,fontSize:"24px",fontWeight:700,color:"#12222F",
            formatter:()=>fmt(ind,cur)}}}},
      series:[+score.toFixed(0)],labels:[anoTopo+(ind.meta!=null?" · vs meta":" ")]});
  }

  if(modo==="heatmap"){
    const series=anosSel.map(a=>({name:String(a),data:MESES.map((m,i)=>({x:m,y:+ (i<=ultimoMes(a)?ind.value(BASE[a][i]):0).toFixed(ind.money?0:1)}))}));
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"heatmap",height:300},
      dataLabels:{enabled:false},
      colors:["#185FA5"],
      plotOptions:{heatmap:{radius:4,enableShades:true,shadeIntensity:.55,
        colorScale:{ranges:[]}}},
      series,xaxis:{categories:MESES},
      tooltip:{y:{formatter:v=>fmt(ind,v)}}});
  }

  if(modo==="acumulado"){
    const tipo=ind.acum==="media"||ind.unit==="%"?"media":"soma";
    const series=anosSel.map(a=>({name:String(a),data:acumular(serie(a,ind),tipo).map(v=>+v.toFixed(ind.money?0:2))}));
    return mk(id,{...baseOpts,chart:{...baseOpts.chart,type:"line",height:300},
      colors:anosSel.map(a=>CORES_ANO[a]),stroke:{curve:CURVA,width:3,lineCap:"round"},
      series,xaxis:{categories:MESES,axisBorder:{show:false},axisTicks:{show:false}},
      yaxis:{labels:{formatter:fmtEixo(ind)}},markers:{size:0,hover:{size:5}}});
  }

  // linhas / barras / área (multi-ano)
  const tipo=modo==="barras"?"bar":modo==="area"?"area":"line";
  const series=anosSel.map(a=>({name:String(a),data:MESES.map((_,i)=>i<=ultimoMes(a)?+ind.value(BASE[a][i]).toFixed(2):null)}));
  mk(id,{...baseOpts,chart:{...baseOpts.chart,type:tipo,height:300},
    colors:anosSel.map(a=>CORES_ANO[a]),
    stroke:{curve:CURVA,width:tipo==="bar"?0:3,lineCap:"round"},
    fill:tipo==="area"?{type:"gradient",gradient:{shadeIntensity:.3,opacityFrom:.35,opacityTo:.05}}:{opacity:1},
    plotOptions:{bar:{borderRadius:7,columnWidth:"55%",borderRadiusApplication:"end"}},
    series,xaxis:{categories:MESES,axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{labels:{formatter:fmtEixo(ind)},max:ind.unit==="%"&&ind.higher?100:undefined},
    markers:{size:0,hover:{size:5}},annotations:metaAnn});
}

/* ============================================================
   Modal de lançamento
   ============================================================ */
function abrirModal(prefInd){
  const sAno=document.getElementById("edAno"),sInd=document.getElementById("edInd"),sFrom=document.getElementById("edProjFrom");
  sAno.innerHTML=ANOS.map(a=>`<option ${a===2026?"selected":""}>${a}</option>`).join("");
  const dim=DIMS.find(d=>d.id===dimAtiva);
  sInd.innerHTML=dim.inds.map(id=>`<option value="${id}" ${id===prefInd?"selected":""}>${IND[id].nome}</option>`).join("");
  sFrom.innerHTML=MESES.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
  sFrom.value=String(Math.max(0,new Date().getMonth()));
  montarTabela();document.getElementById("overlay").classList.add("open");
}
function fecharModal(){document.getElementById("overlay").classList.remove("open");}
function montarTabela(){
  const ano=+document.getElementById("edAno").value,id=document.getElementById("edInd").value,ind=IND[id];
  const rot={totalPed:"Total ped.",frac:"Fracionados",otif:"No prazo+compl.",itensPed:"Itens ped.",itensEnt:"Itens entr.",
    real:"Demanda real",previsto:"Demanda prev.",faturamento:"Faturamento R$",custoTransp:"Transporte R$",custoWh:"Armazém R$",
    devolucao:"Devolução R$",noPrazoPct:"% no prazo",acuraInv:"% acur. estq.",coberturaDias:"Cobertura (d)",ruptura:"% ruptura",
    avarias:"% avarias",divergencias:"% diverg.",reclamacoes:"Reclamações",leadTotal:"Lead (d)",prazoEntrega:"Prazo (d)",
    cicloPedido:"Ciclo (d)",produtividade:"Prod. ped/HH",absenteismo:"% absent.",turnover:"% turnover",headcount:"Headcount"};
  let head="<tr><th>Campo</th>"+MESES.map(m=>`<th>${m}</th>`).join("")+"</tr>";
  let rows=ind.campos.map(c=>`<tr><th style="text-align:left">${rot[c]||c}</th>`+
    BASE[ano].map((d,i)=>`<td><input data-c="${c}" data-m="${i}" type="number" step="any" value="${+(+d[c]).toFixed(2)}"></td>`).join("")+"</tr>").join("");
  document.getElementById("edTable").innerHTML=head+rows;
}
function lerTabela(){const ano=+document.getElementById("edAno").value;
  document.querySelectorAll("#edTable input").forEach(inp=>{const v=inp.value===""?null:+inp.value;if(v!=null)BASE[ano][+inp.dataset.m][inp.dataset.c]=v;});
  return ano;}
function preencherProjecao(){
  const from=+document.getElementById("edProjFrom").value,inputs=[...document.querySelectorAll("#edTable input")];
  const campos=[...new Set(inputs.map(i=>i.dataset.c))];
  campos.forEach(c=>{const vals=[];for(let m=0;m<12;m++){const inp=inputs.find(i=>i.dataset.c===c&&+i.dataset.m===m);
    if(m<from&&inp.value!==""){vals.push(+inp.value);}else if(m>=from){const k=Math.min(3,vals.length);
      const md=k?vals.slice(-k).reduce((s,v)=>s+v,0)/k:(vals.at(-1)||0);const proj=+(md*(1+0.005*(m-from+1))).toFixed(2);inp.value=proj;vals.push(proj);}
    else if(inp.value!=="")vals.push(+inp.value);}});
  toast("Projeção preenchida a partir de "+MESES[from]);
}
async function salvar(){
  const ano=lerTabela();document.getElementById("edStatus").textContent="Salvando…";
  try{
    if(API_BASE){const r=await fetch(API_BASE+"/api/dados/"+ano,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(BASE[ano])});if(!r.ok)throw 0;}
    salvarPrefs();renderDim();document.getElementById("edStatus").textContent="Salvo ✓";
    toast(API_BASE?"Salvo no backend ✓":"Aplicado na sessão ✓");fecharModal();
  }catch(e){renderDim();document.getElementById("edStatus").textContent="Backend off — aplicado só na sessão";toast("Backend indisponível — mantido na sessão");}
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- carga de dados (não-destrutiva) ----------
   Ordem: backend (se API_BASE) -> ./dados.json do repo -> base de demonstração.
   Só adota dados externos se o schema for compatível; caso contrário mantém a
   base de demonstração e AVISA no console, sem nunca alterar o arquivo. */
function mapearDados(raw){
  if(!raw||typeof raw!=="object") return null;
  const anos=Object.keys(raw).filter(k=>/^20\d\d$/.test(k));
  if(!anos.length) return null;
  const amostra=raw[anos[0]];
  if(!Array.isArray(amostra)||amostra.length!==12) return null;
  // ajuste estes campos se o seu dados.json usar outros nomes:
  const esperados=["totalPed","otif","frac","faturamento"];
  if(!esperados.every(c=>c in (amostra[0]||{}))) return null; // schema diferente -> mantém demo
  const out={}; anos.forEach(a=>out[+a]=raw[a]); return out;
}
async function carregar(){
  if(API_BASE){try{const r=await fetch(API_BASE+"/api/dados");if(r.ok){const m=mapearDados(await r.json());if(m){BASE=m;return;}}}catch(e){}}
  try{const r=await fetch(FONTE_DADOS,{cache:"no-store"});if(r.ok){const m=mapearDados(await r.json());
    if(m){BASE=m;return;} console.warn("dados.json com schema diferente do esperado — exibindo base de demonstração. O arquivo NÃO foi alterado. Ajuste mapearDados() para conectar seus dados.");}}catch(e){}
}

/* ---------- eventos ---------- */
document.getElementById("btnEdit").onclick=()=>abrirModal(window._selInd);
document.getElementById("btnClose").onclick=fecharModal;
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")fecharModal();};
document.getElementById("edAno").onchange=montarTabela;
document.getElementById("edInd").onchange=montarTabela;
document.getElementById("btnFillProj").onclick=preencherProjecao;
document.getElementById("btnPreview").onclick=()=>{lerTabela();renderDim();toast("Preview aplicado (não salvo)");};
document.getElementById("btnSave").onclick=salvar;
document.getElementById("btnProj").onclick=()=>{abrirModal(window._selInd);setTimeout(preencherProjecao,60);};

/* ---------- início ---------- */
(async function(){await carregar();renderTabs();renderChips();renderDim();})();
</script>
