<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Torre de Controle — Auditoria Fiscal</title>
<style>
:root{--bg:#020617;--panel:#0b1220;--panel2:#0f1a2e;--line:#1e293b;--txt:#e2e8f0;--muted:#64748b;
--cyan:#22d3ee;--violet:#a78bfa;--amber:#fbbf24;--emerald:#34d399;--rose:#fb7185;
--mono:ui-monospace,Menlo,Consolas,monospace;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:24px 16px}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#06b6d4,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
h1{font-size:18px;margin:0;font-weight:650}h1 span{color:var(--cyan)}
.sub{font-size:12px;color:var(--muted)}
.upd{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-upd{background:var(--cyan);border:0;color:#04222b;font-weight:600;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}
.btn-upd:disabled{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select{background:#020617;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 10px;font-size:13px;min-width:150px;outline:none}
select:focus{border-color:var(--cyan)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:7px 12px;font-size:12px;cursor:pointer}
.seg button.on{background:#1e293b;color:var(--cyan)}
.btn-clear{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;align-self:flex-end}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px}
.natgroup{margin-bottom:18px}
.nathead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px;border-bottom:2px solid var(--cyan)}
.natname{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.natsub{font-size:12px;color:var(--muted)}
.card{background:rgba(15,23,42,.4);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:12px;border-bottom:1px solid #131f33;vertical-align:middle}
tr:last-child td{border-bottom:0}
.cliente{font-size:16px;font-weight:600;color:#f1f5f9;line-height:1.2}
.cliente .uf{font-size:11px;color:var(--muted);font-weight:400}
.origem{font-size:11px;color:var(--muted);margin-top:3px}
.notatag{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.mono{font-family:var(--mono)}.tiny{font-size:10px;color:var(--muted)}
.r{text-align:right}.c{text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;white-space:nowrap}
.p-ok{background:rgba(52,211,153,.15);color:var(--emerald)}
.p-no{background:rgba(100,116,139,.18);color:#64748b}
.p-pend{background:#1e293b;color:#64748b}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.qhead{background:var(--panel2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.qtitle{font-size:15px;font-weight:600}.qtot{font-size:18px;font-weight:700;color:var(--emerald)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:20px}
</style></head><body><div class="wrap">
<header><div class="logo">F</div><div>
<h1>Torre de Controle <span>&middot; Auditoria Fiscal</span></h1>
<div class="sub">Notas por natureza de operacao &middot; vinculos NF / CT-e / confirmacao</div></div>
<div class="upd">
  <span class="status" id="status"></span>
  <button class="btn-upd" id="btnUpd" onclick="atualizar()">Atualizar</button>
</div></header>

<div class="filters">
  <div class="fg"><label>Emitente</label><select id="fEmit"></select></div>
  <div class="fg"><label>Destinatario (cliente)</label><select id="fDest"></select></div>
  <div class="fg"><label>Mes</label><select id="fMes"></select></div>
  <div class="fg"><label>Visao</label><div class="seg" id="segVisao">
    <button data-v="nota" class="on">Por nota</button>
    <button data-v="quarter">Acumulado / quarter</button></div></div>
  <button class="btn-clear" onclick="limpar()">Limpar filtros</button>
</div>

<div class="kpis" id="kpis"></div>
<div id="view"><div class="empty">Carregando dados...</div></div>
<div class="foot">Dados do Supabase (dashboards/auditoria/dados.json). O botao Atualizar reprocessa as pastas quando rodado pelo programa local.</div>
</div>
<script>
const SUPA='https://ennsbpibfnuwlvtodukg.supabase.co';
const STORAGE=SUPA+'/storage/v1/object/public/dashboards/auditoria/dados.json';
let DATA={notas:[],ctes:[],refs:[],manifs:[]};

const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ck=c=>(c||'').replace(/(\d{4})(?=\d)/g,'$1 ');
const d10=s=>(s||'').slice(0,10);
const mesDe=s=>(s||'').slice(0,7);
const MESES=['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesLabel=ym=>{const[a,m]=ym.split('-');return MESES[+m]+'/'+a};
const quarterDe=s=>{const m=+(s||'0-0').slice(5,7);const a=(s||'').slice(0,4);return a+'-Q'+(Math.ceil(m/3))};
function st(t){document.getElementById('status').textContent=t||''}

async function carregarDados(){
  for(const u of [STORAGE+'?t='+Date.now(), './dados.json?t='+Date.now()]){
    try{const r=await fetch(u);if(r.ok)return await r.json();}catch(e){}
  }
  return {notas:[],ctes:[],refs:[],manifs:[]};
}

async function atualizar(){
  const b=document.getElementById('btnUpd');b.disabled=true;st('Reprocessando pastas...');
  try{
    const r=await fetch('/atualizar');
    if(r.ok){DATA=await carregarDados();montarFiltros();render();st('Atualizado agora.');b.disabled=false;return;}
  }catch(e){}
  DATA=await carregarDados();montarFiltros();render();
  st('Dados recarregados da nuvem. Para reprocessar as pastas, rode o programa local (auditoria.py).');
  b.disabled=false;
}

let state={emit:'',dest:'',mes:'',visao:'nota'};
const refByNota={},confByNota={};
function indexar(){for(const k in refByNota)delete refByNota[k];for(const k in confByNota)delete confByNota[k];
  DATA.refs.forEach(r=>{const c=DATA.ctes.find(x=>x.chave===r.chave_cte);(refByNota[r.chave_nfe]=refByNota[r.chave_nfe]||[]).push(c?c.numero:'?')});
  DATA.manifs.forEach(mf=>{confByNota[mf.chave_nfe]=mf.data_arquivo})}

function opts(sel,vals,label){const el=document.getElementById(sel);const cur=el.value;
  el.innerHTML='<option value="">Todos</option>'+vals.map(v=>`<option value="${v}">${label?label(v):v}</option>`).join('');el.value=cur}
function montarFiltros(){indexar();
  opts('fEmit',[...new Set(DATA.notas.map(n=>n.nome_emitente))].sort());
  opts('fDest',[...new Set(DATA.notas.map(n=>n.nome_destinatario))].sort());
  opts('fMes',[...new Set(DATA.notas.map(n=>mesDe(n.data_emissao)))].sort(),mesLabel)}

['fEmit','fDest','fMes'].forEach((id,i)=>document.getElementById(id).onchange=e=>{state[['emit','dest','mes'][i]]=e.target.value;render()});
document.querySelectorAll('#segVisao button').forEach(b=>b.onclick=()=>{state.visao=b.dataset.v;document.querySelectorAll('#segVisao button').forEach(x=>x.classList.toggle('on',x===b));render()});
function limpar(){state.emit=state.dest=state.mes='';document.getElementById('fEmit').value='';document.getElementById('fDest').value='';document.getElementById('fMes').value='';render()}

function filtradas(){return DATA.notas.filter(n=>(!state.emit||n.nome_emitente===state.emit)&&(!state.dest||n.nome_destinatario===state.dest)&&(!state.mes||mesDe(n.data_emissao)===state.mes))}
function pill(on,label,pend){if(pend)return '<span class="pill p-pend">pendente</span>';return on?`<span class="pill p-ok">${label||'sim'}</span>`:'<span class="pill p-no">&mdash;</span>'}
function kpis(fn){const tot=fn.reduce((s,n)=>s+ +n.valor_total,0),cte=fn.filter(n=>refByNota[n.chave]).length,conf=fn.filter(n=>confByNota[n.chave]).length;
  document.getElementById('kpis').innerHTML=[['Notas',fn.length,'cyan'],['Valor total',brl(tot),''],['Com CT-e',cte,'violet'],['Confirmadas (saida)',conf,'emerald']].map(k=>`<div class="kpi"><div class="k">${k[0]}</div><div class="v" style="color:var(--${k[2]||'txt'},#e2e8f0)">${k[1]}</div></div>`).join('')}

function render(){const fn=filtradas();kpis(fn);const v=document.getElementById('view');
 if(!fn.length){v.innerHTML='<div class="qcard"><div class="empty">Nenhuma nota para os filtros selecionados.</div></div>';return}
 if(state.visao==='nota'){
   const g={};fn.forEach(n=>{(g[n.natureza_operacao]=g[n.natureza_operacao]||[]).push(n)});
   v.innerHTML=Object.keys(g).sort().map(nat=>{const ns=g[nat],sub=ns.reduce((s,n)=>s+ +n.valor_total,0);
     return `<div class="natgroup"><div class="nathead"><span class="natname">${nat}</span><span class="natsub">${ns.length} nota(s) &middot; ${brl(sub)}</span></div>
       <div class="card"><table><thead><tr><th>Cliente (destinatario)</th><th>Nota / emissao</th><th class="r">Valor</th><th class="c">Romaneio</th><th class="c">CT-e</th><th class="c">Confirmacao</th></tr></thead><tbody>`+
       ns.map(n=>`<tr><td><div class="cliente">${n.nome_destinatario} <span class="uf">(${n.uf_destinatario})</span></div><div class="origem">de ${n.nome_emitente} &middot; ${n.uf_emitente}</div></td>
         <td><span class="notatag">${n.numero}/${n.serie}</span><div class="tiny">${d10(n.data_emissao)}</div></td>
         <td class="r"><b>${brl(n.valor_total)}</b></td>
         <td class="c">${pill(false,null,true)}</td>
         <td class="c">${pill(!!refByNota[n.chave],refByNota[n.chave]?'CT-e '+refByNota[n.chave].join(', '):null)}</td>
         <td class="c">${pill(!!confByNota[n.chave],confByNota[n.chave]?d10(confByNota[n.chave]):null)}</td></tr>`).join('')+
       '</tbody></table></div></div>'}).join('')}
 else{
   const qs={};fn.forEach(n=>{const q=quarterDe(n.data_emissao);qs[q]=qs[q]||{nat:{},count:0,total:0};qs[q].count++;qs[q].total+= +n.valor_total;
     qs[q].nat[n.natureza_operacao]=qs[q].nat[n.natureza_operacao]||{count:0,total:0};qs[q].nat[n.natureza_operacao].count++;qs[q].nat[n.natureza_operacao].total+= +n.valor_total});
   v.innerHTML=Object.keys(qs).sort().map(q=>{const d=qs[q];
     return `<div class="qcard"><div class="qhead"><span class="qtitle">${q} <span class="tiny">&middot; ${d.count} notas</span></span><span class="qtot">${brl(d.total)}</span></div>
       <table><thead><tr><th>Natureza de operacao</th><th class="r">Notas</th><th class="r">Valor acumulado</th></tr></thead><tbody>`+
       Object.keys(d.nat).sort().map(nat=>`<tr><td>${nat}</td><td class="r mono">${d.nat[nat].count}</td><td class="r"><b>${brl(d.nat[nat].total)}</b></td></tr>`).join('')+
       '</tbody></table></div>'}).join('')}
}

(async()=>{st('Carregando...');DATA=await carregarDados();montarFiltros();render();st('Pronto. '+DATA.notas.length+' notas.')})();
</script></body></html>
